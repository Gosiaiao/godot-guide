  <script id="site-data" type="application/json">{"title":"Godot 4 系统学习指南","version":"4.7","homeHtml":"\n    <section id=\"godot-docs-guide\">\n      <h1>Godot 4 系统学习指南</h1>\n      <div class=\"admonition note\">\n        <p class=\"admonition-title\">备注</p>\n        <p><strong>适用版本</strong>：以 <a href=\"https://godotengine.org/download/windows/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">Godot 4.7</a> Standard 稳定版为准，Godot 4.4 及以上版本基本适用<br>\n<strong>文档定位</strong>：系统学习主线与精选视频导航<br>\n<strong>阅读方式</strong>：结合 Godot 编辑器同步阅读与实践，每完成一篇后对照末尾的能力自检确认掌握情况。</p>\n\n      </div>\n      <p>欢迎来到 <a class=\"reference external\" href=\"https://godotengine.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Godot 引擎</a> 系统学习指南。Godot 引擎是一款自由开源、由社区驱动的 2D 和 3D 游戏引擎！如果是初次阅读本文档，建议先阅读 <a class=\"reference internal\" href=\"#preface\">序言：行前指南</a>，对引擎定位、语言选型与版本差异建立整体了解。</p>\n      <p>要开始阅读相关文档，请选择与当前技能水平匹配的图块：</p>\n      <div class=\"grid-container\">\n        <a class=\"grid-item new-to-game\" href=\"#part-1\">\n          零基础刚接触 Godot，<br>\n          <strong>想做出第一个能玩的小游戏。</strong>\n        </a>\n        <a class=\"grid-item know-game-learn-godot\" href=\"#part-2\">\n          已经熟悉基础节点，<br>\n          <strong>想掌握地图、动画、UI 与音频子系统。</strong>\n        </a>\n        <a class=\"grid-item know-godot-learn-godot\" href=\"#part-3\">\n          已经能做出小型 Demo，<br>\n          <strong>想学习数据驱动与常用设计模式。</strong>\n        </a>\n        <a class=\"grid-item contribute-to-godot\" href=\"#part-4\">\n          准备开发完整项目，<br>\n          <strong>想掌握项目架构、Git 协作与调试。</strong>\n        </a>\n      </div>\n      <br>\n      <p>你还可以使用侧边栏的目录，快速定位目标主题对应的文档章节。也可以使用左上角的搜索功能（按 <kbd class=\"kbd\">/</kbd> 快捷键直达）。</p>\n\n      <section id=\"more-topics\">\n        <h2>拓展与参考</h2>\n        <p>完成核心四篇主线后，可按实际项目需求查阅以下拓展专题与资料索引：</p>\n        <ul>\n          <li><a class=\"reference internal\" href=\"#part-5\"><strong>第五篇：进阶拓展地图</strong></a> — GDShader 着色器入门、3D 核心差异、性能优化、多人联机基础与跨平台导出。</li>\n          <li><a class=\"reference internal\" href=\"#epilogue\"><strong>结语：从教程转向独立 Demo 与 Game Jam</strong></a> — 脱离教程依赖，通过小型原型与极限开发比赛持续提升工程能力。</li>\n          <li><a class=\"reference internal\" href=\"#appendix\"><strong>附录：学习资料与素材索引</strong></a> — 全阶段精选视频总览表与免费可商用游戏素材网站汇总。</li>\n        </ul>\n      </section>\n    </section>\n  ","chapters":[{"id":"preface","group":"关于","title":"序言：行前指南","shortTitle":"序言：行前指南","summary":"介绍 Godot 引擎定位、GDScript 与 C# 语言选型对比、文档使用方法与 4.x 版本差异速查。","sections":[{"id":"preface-s2","title":"1. 为什么选择 Godot"},{"id":"preface-s3","title":"2. 版本与编程语言选型"},{"id":"preface-s4","title":"3. 本指南的使用方法"},{"id":"preface-s5","title":"序言参考资料"}],"html":"<h1 id=\"preface-s1\">序言：行前指南</h1>\n<h3 id=\"preface-s2\">1. 为什么选择 Godot<a class=\"headerlink\" href=\"#preface/preface-s2\" title=\"永久链接至标题\">¶</a></h3>\n<ul>\n<li><strong>轻量快捷</strong>：安装包仅几十 MB，解压即用，打开只需要两秒，对电脑配置要求低。</li>\n<li><strong>免费开源</strong>：采用 MIT 协议，做完游戏发布 Steam、参加比赛或独立开发，都没有抽成与授权限制。</li>\n<li><strong>2D 体验出色，3D 满足常见需求</strong>：拥有独立的 2D 像素与渲染引擎，而非用 3D 强行压扁，对独立游戏、Game Jam 和社团原型开发非常友好。</li>\n<li><strong>概念统一</strong>：核心设计围绕节点与场景展开，上手门槛低，代码结构清晰直观。</li>\n</ul>\n<h3 id=\"preface-s3\">2. 版本与编程语言选型<a class=\"headerlink\" href=\"#preface/preface-s3\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">选项</th>\n<th style=\"text-align:left\">适用人群</th>\n<th style=\"text-align:left\">优点</th>\n<th style=\"text-align:left\">注意事项</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>GDScript，入门首选</strong></td>\n<td style=\"text-align:left\">零基础、快速做原型、参加 Game Jam、绝大多数 2D 与轻中度 3D 项目</td>\n<td style=\"text-align:left\">语法接近 Python，上手快；与编辑器深度集成；绝大多数社区教程都使用它；支持导出网页端</td>\n<td style=\"text-align:left\">应尽早使用静态类型注解，详见 1.3 节</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong>C# .NET 版</strong></td>\n<td style=\"text-align:left\">已有扎实的 C#/.NET 或 Unity 经验，计划开发重计算逻辑的中大型项目</td>\n<td style=\"text-align:left\">执行性能较高，强类型工程生态完善</td>\n<td style=\"text-align:left\">需要额外安装 .NET SDK；不少教程需要自行改写语法；<a href=\"https://docs.godotengine.org/en/latest/tutorials/export/exporting_for_web.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">官方明确目前无法导出至 Web 网页端</a></td>\n</tr>\n</tbody>\n</table></div>\n<p>初学者无需在语言选型上过度耗费时间。先用 GDScript 完成前两篇内容并做出两个小游戏，熟悉引擎本身的工作方式后，后续若有需要转向 C#，迁移成本很低——两者的 API 基本一致，只是命名风格从蛇形命名换成了帕斯卡命名。</p>\n<h3 id=\"preface-s4\">3. 本指南的使用方法<a class=\"headerlink\" href=\"#preface/preface-s4\" title=\"永久链接至标题\">¶</a></h3>\n<ol>\n<li><strong>善用文档与排错工具</strong>：在编辑器中按 <kbd class=\"kbd docutils literal notranslate\">F1</kbd> 可离线搜索所有节点与函数说明；在脚本里按住 <code class=\"docutils literal notranslate\">Ctrl</code> 并左键点击任意类名、属性或方法，即可直接跳转查看文档。开发过程中遇到报错时，应优先阅读错误堆栈、查阅官方文档或借助 AI 工具定位问题。</li>\n<li><strong>以能力自检衡量进度</strong>：每篇末尾均列出该阶段应当具备的核心能力，可用于自查是否具备进入下一阶段的基础，避免停留在单纯观看教程。</li>\n<li><strong>留意版本差异</strong>：查阅外部资料时优先确认教程基于 Godot 4。常见版本差异速查如下：\n<ul>\n<li><strong>Godot 3 与 Godot 4</strong>：接口变动大，例如 <code class=\"docutils literal notranslate\">KinematicBody2D</code> 已改为 <code class=\"docutils literal notranslate\">CharacterBody2D</code>，<code class=\"docutils literal notranslate\">yield</code> 已改为 <code class=\"docutils literal notranslate\">await</code>，不建议照搬 Godot 3 代码。</li>\n<li><strong>Godot 4.0–4.2 与 4.3+</strong>：4.3 起新增 <code class=\"docutils literal notranslate\">TileMapLayer</code> 替代旧版 <code class=\"docutils literal notranslate\">TileMap</code>，并支持单线程 Web 导出。</li>\n<li><strong>Godot 4.4 及以上</strong>：为资源新增独立的 <code class=\"docutils literal notranslate\">.uid</code> 文件用于追踪引用，多人协作时需纳入 Git 版本管理。</li>\n<li><strong>Godot 4.4 至 4.7</strong>：核心脚本语法与节点体系保持高度兼容，本指南与 4.4+ 社区教程在 4.7 中均可顺畅适用，遇到细微编辑器选项位置变动时以内置文档和当前版本界面为准。</li>\n</ul>\n</li>\n</ol>\n<h3 id=\"preface-s5\">序言参考资料<a class=\"headerlink\" href=\"#preface/preface-s5\" title=\"永久链接至标题\">¶</a></h3>\n<ul>\n<li><strong>Godot 官方中文文档入门章节</strong>：<a href=\"https://docs.godotengine.org/zh-cn/4.x/getting_started/introduction/index.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://docs.godotengine.org/zh-cn/4.x/getting_started/introduction/index.html</a> ，用于快速建立对引擎定位、核心概念与学习路线的整体认知。</li>\n</ul>\n","plainText":"序言：行前指南 1. 为什么选择 Godot 轻量快捷 ：安装包仅几十 MB，解压即用，打开只需要两秒，对电脑配置要求低。 免费开源 ：采用 MIT 协议，做完游戏发布 Steam、参加比赛或独立开发，都没有抽成与授权限制。 2D 体验出色，3D 满足常见需求 ：拥有独立的 2D 像素与渲染引擎，而非用 3D 强行压扁，对独立游戏、Game Jam 和社团原型开发非常友好。 概念统一 ：核心设计围绕节点与场景展开，上手门槛低，代码结构清晰直观。 2. 版本与编程语言选型 选项 适用人群 优点 注意事项 GDScript，入门首选 零基础、快速做原型、参加 Game Jam、绝大多数 2D 与轻中度 3D 项目 语法接近 Python，上手快；与编辑器深度集成；绝大多数社区教程都使用它；支持导出网页端 应尽早使用静态类型注解，详见 1.3 节 C# .NET 版 已有扎实的 C#/.NET 或 Unity 经验，计划开发重计算逻辑的中大型项目 执行性能较高，强类型工程生态完善 需要额外安装 .NET SDK；不少教程需要自行改写语法； 官方明确目前无法导出至 Web 网页端 初学者无需在语言选型上过度耗费时间。先用 GDScript 完成前两篇内容并做出两个小游戏，熟悉引擎本身的工作方式后，后续若有需要转向 C#，迁移成本很低——两者的 API 基本一致，只是命名风格从蛇形命名换成了帕斯卡命名。 3. 本指南的使用方法 善用文档与排错工具 ：在编辑器中按 F1 可离线搜索所有节点与函数说明；在脚本里按住 Ctrl 并左键点击任意类名、属性或方法，即可直接跳转查看文档。开发过程中遇到报错时，应优先阅读错误堆栈、查阅官方文档或借助 AI 工具定位问题。 以能力自检衡量进度 ：每篇末尾均列出该阶段应当具备的核心能力，可用于自查是否具备进入下一阶段的基础，避免停留在单纯观看教程。 留意版本差异 ：查阅外部资料时优先确认教程基于 Godot 4。常见版本差异速查如下： Godot 3 与 Godot 4 ：接口变动大，例如 KinematicBody2D 已改为 CharacterBody2D ， yield 已改为 await ，不建议照搬 Godot 3 代码。 Godot 4.0–4.2 与 4.3+ ：4.3 起新增 TileMapLayer 替代旧版 TileMap ，并支持单线程 Web 导出。 Godot 4.4 及以上 ：为资源新增独立的 .uid 文件用于追踪引用，多人协作时需纳入 Git 版本管理。 Godot 4.4 至 4.7 ：核心脚本语法与节点体系保持高度兼容，本指南与 4.4+ 社区教程在 4.7 中均可顺畅适用，遇到细微编辑器选项位置变动时以内置文档和当前版本界面为准。 序言参考资料 Godot 官方中文文档入门章节 ： https://docs.godotengine.org/zh-cn/4.x/getting_started/introduction/index.html ，用于快速建立对引擎定位、核心概念与学习路线的整体认知。"},{"id":"part-1","group":"新手入门","title":"第一篇：引擎基石与最小闭环","shortTitle":"第一篇：引擎基石与最小闭环","summary":"编辑器核心面板、节点与场景树、静态类型 GDScript、生命周期、信号系统、物理碰撞与最小导出流程。","sections":[{"id":"part-1-s2","title":"1.1 编辑器五大核心面板"},{"id":"part-1-s3","title":"1.2 Godot 的核心：节点与场景树"},{"id":"part-1-s4","title":"1.3 GDScript 核心语法与静态类型规范"},{"id":"part-1-s5","title":"1.4 生命周期与帧循环"},{"id":"part-1-s6","title":"1.5 信号系统"},{"id":"part-1-s7","title":"1.6 物理、碰撞与输入"},{"id":"part-1-s11","title":"1.7 最小导出流程"},{"id":"part-1-s12","title":"第一篇推荐视频与教程"},{"id":"part-1-s13","title":"第一篇能力自检"}],"html":"<h1 id=\"part-1-s1\">第一篇：引擎基石与最小闭环</h1>\n<div class=\"admonition note\"><p class=\"admonition-title\">本篇目标</p><p>熟悉编辑器布局，理解节点、场景与信号三大核心机制，写出带静态类型的 GDScript，并跑通从新建工程到导出运行文件的完整流程。</p></div>\n<h3 id=\"part-1-s2\">1.1 编辑器五大核心面板<a class=\"headerlink\" href=\"#part-1/part-1-s2\" title=\"永久链接至标题\">¶</a></h3>\n<p>打开 Godot 后，界面主要分为五个工作区：</p>\n<ol>\n<li><strong>Scene 场景面板</strong>：位于左上角，用于管理当前场景的节点树结构。</li>\n<li><strong>FileSystem 文件系统</strong>：位于左下角，用于管理项目内所有资源，<code class=\"docutils literal notranslate\">res://</code> 表示项目根目录。</li>\n<li><strong>Viewport 主视口</strong>：位于中央，可在 2D、3D、Script 脚本和 AssetLib 资源库之间切换。</li>\n<li><strong>Inspector 检查器</strong>：位于右侧，用于查看和修改选中节点的属性；旁边的 <strong>Node</strong> 标签页用于管理信号和分组。</li>\n<li><strong>底部面板</strong>：包含 Output 输出日志、Debugger 调试器、Audio 音频总线和 Animation 动画编辑器。</li>\n</ol>\n<h3 id=\"part-1-s3\">1.2 Godot 的核心：节点与场景树<a class=\"headerlink\" href=\"#part-1/part-1-s3\" title=\"永久链接至标题\">¶</a></h3>\n<p>Godot 的基本模型非常纯粹：整个游戏运行在一棵场景树上，树上的最小功能单元叫<strong>节点 Node</strong>，把一组节点保存为 <code class=\"docutils literal notranslate\">.tscn</code> 文件供复用就叫<strong>场景 Scene</strong>。</p>\n<p>场景既是关卡，也是可复用的预制体。主角是一个场景，一颗子弹是一个场景，一张地图也是一个场景，可以把主角场景直接拖进地图场景中嵌套使用。</p>\n<p>学习初期不需要去背诵上百个节点，先记住四大基类，通过图标颜色就能一眼分辨：</p>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">基类</th>\n<th style=\"text-align:left\">图标颜色</th>\n<th style=\"text-align:left\">作用与定位</th>\n<th style=\"text-align:left\">常见子类举例</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">Node</code></strong></td>\n<td style=\"text-align:left\">白色</td>\n<td style=\"text-align:left\">纯逻辑节点，没有空间坐标</td>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">Timer</code>、<code class=\"docutils literal notranslate\">AnimationPlayer</code>、<code class=\"docutils literal notranslate\">AudioStreamPlayer</code></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">Node2D</code></strong></td>\n<td style=\"text-align:left\">蓝色</td>\n<td style=\"text-align:left\">所有 2D 对象的基类，带有平面位置、旋转与缩放</td>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">Sprite2D</code>、<code class=\"docutils literal notranslate\">CharacterBody2D</code>、<code class=\"docutils literal notranslate\">Area2D</code>、<code class=\"docutils literal notranslate\">Camera2D</code>、<code class=\"docutils literal notranslate\">TileMapLayer</code></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">Node3D</code></strong></td>\n<td style=\"text-align:left\">红色</td>\n<td style=\"text-align:left\">所有 3D 对象的基类，带有三维变换</td>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">MeshInstance3D</code>、<code class=\"docutils literal notranslate\">CharacterBody3D</code>、<code class=\"docutils literal notranslate\">Camera3D</code>、<code class=\"docutils literal notranslate\">DirectionalLight3D</code></td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">Control</code></strong></td>\n<td style=\"text-align:left\">绿色</td>\n<td style=\"text-align:left\">所有 UI 元素的基类，支持锚点与容器布局</td>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">Button</code>、<code class=\"docutils literal notranslate\">Label</code>、<code class=\"docutils literal notranslate\">TextureRect</code>、<code class=\"docutils literal notranslate\">VBoxContainer</code>、<code class=\"docutils literal notranslate\">Panel</code></td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"part-1-s4\">1.3 GDScript 核心语法与静态类型规范<a class=\"headerlink\" href=\"#part-1/part-1-s4\" title=\"永久链接至标题\">¶</a></h3>\n<p>GDScript 语法接近 Python，在工程实践中应当从一开始就使用<strong>静态类型注解</strong>：</p>\n<ul>\n<li>编辑器能提供准确的代码自动补全；</li>\n<li>类型写错在编辑阶段就会直接提示，不必等到运行时崩溃；</li>\n<li>在 Godot 4 中，静态类型代码的执行效率明显高于动态类型。</li>\n</ul>\n<p>建议打开设置：<code class=\"docutils literal notranslate\">Editor -&gt; Editor Settings -&gt; Text Editor -&gt; Completion -&gt; Add Type Hints</code>，让编辑器自动补充类型提示。</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ff7085\">class_name</span> <span style=\"color:#c7ffed\">Player</span>  <span style=\"color:#ffffff80;font-style:italic\"># 注册全局类名，方便其他脚本做类型注解</span>\n<span style=\"color:#ff7085\">extends</span> <span style=\"color:#c7ffed\">CharacterBody2D</span>\n\n<span style=\"color:#ffffff80;font-style:italic\"># @export 将变量暴露到右侧 Inspector 面板，方便直接调参</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">move_speed</span>: <span style=\"color:#42ffc2\">float</span> = <span style=\"color:#a1ffe0\">220.0</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">max_hp</span>: <span style=\"color:#42ffc2\">int</span> = <span style=\"color:#a1ffe0\">100</span>\n\n<span style=\"color:#ffffff80;font-style:italic\"># @onready 在所有子节点准备就绪后再获取引用</span>\n<span style=\"color:#ffb373\">@onready</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">sprite</span>: <span style=\"color:#c7ffed\">Sprite2D</span> = $<span style=\"color:#c7ffed\">Sprite2D</span>\n<span style=\"color:#ffb373\">@onready</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">anim</span>: <span style=\"color:#c7ffed\">AnimationPlayer</span> = $<span style=\"color:#c7ffed\">AnimationPlayer</span>\n\n<span style=\"color:#ffffff80;font-style:italic\"># 显式声明类型与使用 := 进行类型推断</span>\n<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">current_hp</span>: <span style=\"color:#42ffc2\">int</span> = <span style=\"color:#a1ffe0\">100</span>\n<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">is_invincible</span>: <span style=\"color:#42ffc2\">bool</span> = <span style=\"color:#a1ffe0\">false</span>\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">take_damage</span>(<span style=\"color:#bce0ff\">amount</span>: <span style=\"color:#42ffc2\">int</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#ff8ccc\">if</span> <span style=\"color:#bce0ff\">is_invincible</span>:\n\t\t<span style=\"color:#ff8ccc\">return</span>\n\t<span style=\"color:#bce0ff\">current_hp</span> = <span style=\"color:#57b3ff\">maxi</span>(<span style=\"color:#bce0ff\">current_hp</span> - <span style=\"color:#bce0ff\">amount</span>, <span style=\"color:#a1ffe0\">0</span>)\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">ratio</span> := <span style=\"color:#a3a3f5\">float</span>(<span style=\"color:#bce0ff\">current_hp</span>) / <span style=\"color:#a3a3f5\">float</span>(<span style=\"color:#bce0ff\">max_hp</span>)\n\t<span style=\"color:#a3a3f5\">print</span>(<span style=\"color:#ffeda1\">\"当前血量比例: %.2f\"</span> % <span style=\"color:#bce0ff\">ratio</span>)</code></pre></div></div></div></div>\n<p>再记住两个高频用法：</p>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">await</code></strong>：异步等待某个信号触发，例如延迟 1 秒再继续执行：</li>\n</ul>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#bce0ff\">await</span> <span style=\"color:#57b3ff\">get_tree</span>().<span style=\"color:#57b3ff\">create_timer</span>(<span style=\"color:#a1ffe0\">1.0</span>).<span style=\"color:#bce0ff\">timeout</span>\n<span style=\"color:#a3a3f5\">print</span>(<span style=\"color:#ffeda1\">\"1 秒后执行这里\"</span>)</code></pre></div></div></div></div>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">queue_free()</code></strong>：在当前帧结束后安全销毁节点，通常不要直接调用 <code class=\"docutils literal notranslate\">free()</code>。</li>\n</ul>\n<h3 id=\"part-1-s5\">1.4 生命周期与帧循环<a class=\"headerlink\" href=\"#part-1/part-1-s5\" title=\"永久链接至标题\">¶</a></h3>\n<p>节点从加入场景树到离开场景树，引擎会按固定顺序调用以下回调函数：</p>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">回调函数</th>\n<th style=\"text-align:left\">触发时机与顺序</th>\n<th style=\"text-align:left\">典型用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_init()</code></td>\n<td style=\"text-align:left\">对象在内存中创建时，尚未进入场景树</td>\n<td style=\"text-align:left\">初始化纯数据</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_enter_tree()</code></td>\n<td style=\"text-align:left\">节点进入场景树时，父节点先于子节点执行</td>\n<td style=\"text-align:left\">注册到全局管理器</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_ready()</code></td>\n<td style=\"text-align:left\">该节点及其全部子节点都进入树后，子节点先于父节点执行</td>\n<td style=\"text-align:left\">获取子节点引用、初始化状态、连接信号</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_process(delta)</code></td>\n<td style=\"text-align:left\">每个渲染帧调用一次，频率随硬件帧率波动</td>\n<td style=\"text-align:left\">UI 刷新、动画与非物理逻辑</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_physics_process(delta)</code></td>\n<td style=\"text-align:left\">按固定物理帧率调用，默认 60Hz</td>\n<td style=\"text-align:left\">角色移动、碰撞判断与物理受力</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">_exit_tree()</code></td>\n<td style=\"text-align:left\">节点离开场景树时</td>\n<td style=\"text-align:left\">清理外部引用</td>\n</tr>\n</tbody>\n</table></div>\n<p>在 <code class=\"docutils literal notranslate\">_process</code> 和 <code class=\"docutils literal notranslate\">_physics_process</code> 中计算位移时，需要乘以 <code class=\"docutils literal notranslate\">delta</code> 也就是上一帧的耗时，才能保证 60 帧和 144 帧设备上的移动速度一致。唯一要注意的是，<code class=\"docutils literal notranslate\">CharacterBody2D.move_and_slide()</code> 内部已经乘过 <code class=\"docutils literal notranslate\">delta</code>，给 <code class=\"docutils literal notranslate\">velocity</code> 赋值时不需要再乘一次。</p>\n<h3 id=\"part-1-s6\">1.5 信号系统<a class=\"headerlink\" href=\"#part-1/part-1-s6\" title=\"永久链接至标题\">¶</a></h3>\n<p>信号是 Godot 内置的观察者机制，用来在节点之间解耦通信：发送方只需在状态变化时广播事件，无需关心外部有哪些节点在监听。</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># 在 Player.gd 中定义并发出信号</span>\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">health_changed</span>(<span style=\"color:#bce0ff\">new_hp</span>: <span style=\"color:#42ffc2\">int</span>, <span style=\"color:#bce0ff\">max_hp</span>: <span style=\"color:#42ffc2\">int</span>)\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#bce0ff\">died</span>\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">take_damage</span>(<span style=\"color:#bce0ff\">amount</span>: <span style=\"color:#42ffc2\">int</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#bce0ff\">current_hp</span> = <span style=\"color:#57b3ff\">maxi</span>(<span style=\"color:#bce0ff\">current_hp</span> - <span style=\"color:#bce0ff\">amount</span>, <span style=\"color:#a1ffe0\">0</span>)\n\t<span style=\"color:#bce0ff\">health_changed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#bce0ff\">current_hp</span>, <span style=\"color:#bce0ff\">max_hp</span>)\n\t<span style=\"color:#ff8ccc\">if</span> <span style=\"color:#bce0ff\">current_hp</span> == <span style=\"color:#a1ffe0\">0</span>:\n\t\t<span style=\"color:#bce0ff\">died</span>.<span style=\"color:#57b3ff\">emit</span>()</code></pre></div></div></div></div>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># 在 HUD.gd 或父场景中连接信号，推荐用代码连接以便追踪调用关系</span>\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">_ready</span>() -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#bce0ff\">player</span>.<span style=\"color:#bce0ff\">health_changed</span>.<span style=\"color:#57b3ff\">connect</span>(<span style=\"color:#bce0ff\">_on_player_health_changed</span>)\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">_on_player_health_changed</span>(<span style=\"color:#bce0ff\">new_hp</span>: <span style=\"color:#42ffc2\">int</span>, <span style=\"color:#bce0ff\">max_hp</span>: <span style=\"color:#42ffc2\">int</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#bce0ff\">hp_bar</span>.<span style=\"color:#bce0ff\">max_value</span> = <span style=\"color:#bce0ff\">max_hp</span>\n\t<span style=\"color:#bce0ff\">hp_bar</span>.<span style=\"color:#bce0ff\">value</span> = <span style=\"color:#bce0ff\">new_hp</span></code></pre></div></div></div></div>\n<h3 id=\"part-1-s7\">1.6 物理、碰撞与输入<a class=\"headerlink\" href=\"#part-1/part-1-s7\" title=\"永久链接至标题\">¶</a></h3>\n<h4 id=\"part-1-s8\">四类常用物理与检测节点<a class=\"headerlink\" href=\"#part-1/part-1-s8\" title=\"永久链接至标题\">¶</a></h4>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">StaticBody2D/3D</code></strong>：静止不动的墙体与地面。</li>\n<li><strong><code class=\"docutils literal notranslate\">CharacterBody2D/3D</code></strong>：由代码精确控制移动的角色和敌人，配合 <code class=\"docutils literal notranslate\">velocity</code> 与 <code class=\"docutils literal notranslate\">move_and_slide()</code> 使用。</li>\n<li><strong><code class=\"docutils literal notranslate\">RigidBody2D/3D</code></strong>：交由物理引擎模拟重力、碰撞和弹跳的箱子或碎石，应通过 <code class=\"docutils literal notranslate\">apply_impulse</code> 或 <code class=\"docutils literal notranslate\">apply_force</code> 施加力，不要直接改坐标。</li>\n<li><strong><code class=\"docutils literal notranslate\">Area2D/3D</code></strong>：不产生物理阻挡，专门用于区域检测，适合做金币拾取、攻击判定框、传送门和敌人视野。</li>\n</ul>\n<p>以上四类节点都必须挂载一个 <code class=\"docutils literal notranslate\">CollisionShape2D</code> 或 <code class=\"docutils literal notranslate\">CollisionShape3D</code> 子节点并设置碰撞形状，否则不会生效。</p>\n<h4 id=\"part-1-s9\">Collision Layer 与 Mask 的区分<a class=\"headerlink\" href=\"#part-1/part-1-s9\" title=\"永久链接至标题\">¶</a></h4>\n<p>通常先在 <code class=\"docutils literal notranslate\">Project Settings -&gt; Layer Names -&gt; 2D Physics</code> 中为各层命名，例如 1 为 World、2 为 Player、3 为 Enemy、4 为 PlayerBullet。</p>\n<ul>\n<li><strong>Layer 层</strong>：定义对象自身所属的碰撞分类。例如主角勾选第 2 层，标识其属于 Player 类别。</li>\n<li><strong>Mask 掩码</strong>：定义对象会与哪些分类发生碰撞或检测。例如主角勾选第 1 层和第 3 层，表示主角会被墙壁阻挡并与敌人碰撞，但不会与自身发射的子弹产生碰撞。</li>\n</ul>\n<h4 id=\"part-1-s10\">输入系统：<code class=\"docutils literal notranslate\">InputMap</code> 与输入传播<a class=\"headerlink\" href=\"#part-1/part-1-s10\" title=\"永久链接至标题\">¶</a></h4>\n<p>永远在 <code class=\"docutils literal notranslate\">Project Settings -&gt; Input Map</code> 里定义语义化动作，例如 <code class=\"docutils literal notranslate\">move_left</code>、<code class=\"docutils literal notranslate\">jump</code>、<code class=\"docutils literal notranslate\">attack</code>，不要在代码里写死键盘按键。</p>\n<p>八方向移动推荐使用 <code class=\"docutils literal notranslate\">Input.get_vector()</code>，它会自动做归一化处理，避免斜向移动比直线更快：</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">_physics_process</span>(<span style=\"color:#bce0ff\">_delta</span>: <span style=\"color:#42ffc2\">float</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">dir</span> := <span style=\"color:#c7ffed\">Input</span>.<span style=\"color:#57b3ff\">get_vector</span>(<span style=\"color:#ffeda1\">\"move_left\"</span>, <span style=\"color:#ffeda1\">\"move_right\"</span>, <span style=\"color:#ffeda1\">\"move_up\"</span>, <span style=\"color:#ffeda1\">\"move_down\"</span>)\n\t<span style=\"color:#bce0ff\">velocity</span> = <span style=\"color:#bce0ff\">dir</span> * <span style=\"color:#bce0ff\">move_speed</span>\n\t<span style=\"color:#57b3ff\">move_and_slide</span>()</code></pre></div></div></div></div>\n<p>此外要区分 <code class=\"docutils literal notranslate\">_input(event)</code> 和 <code class=\"docutils literal notranslate\">_unhandled_input(event)</code>：</p>\n<ul>\n<li><code class=\"docutils literal notranslate\">_input</code> 最先接收所有输入，哪怕点击的是 UI 按钮也会触发。</li>\n<li><code class=\"docutils literal notranslate\">_unhandled_input</code> 只接收没有被 UI 消费的输入。角色攻击、交互这类游戏内按键应放在 <code class=\"docutils literal notranslate\">_unhandled_input</code> 中，避免点击界面按钮时角色在背后误触发攻击。</li>\n</ul>\n<h3 id=\"part-1-s11\">1.7 最小导出流程<a class=\"headerlink\" href=\"#part-1/part-1-s11\" title=\"永久链接至标题\">¶</a></h3>\n<p>完成第一个可玩原型后，按以下三步即可跑通桌面端导出流程：</p>\n<ol>\n<li><strong>安装导出模板</strong>：点击顶部菜单 <code class=\"docutils literal notranslate\">Editor -&gt; Manage Export Templates</code>，点击 <code class=\"docutils literal notranslate\">Download and Install</code> 下载并安装与当前引擎版本号完全一致的导出模板。</li>\n<li><strong>创建导出预设</strong>：打开 <code class=\"docutils literal notranslate\">Project -&gt; Export</code>，点击 <code class=\"docutils literal notranslate\">Add...</code> 添加目标平台，例如 <code class=\"docutils literal notranslate\">Windows Desktop</code>，确认主场景已在项目设置中正确指定。</li>\n<li><strong>打包生成可执行文件</strong>：点击 <code class=\"docutils literal notranslate\">Export Project</code> 选择输出路径并导出。默认会生成 <code class=\"docutils literal notranslate\">.exe</code> 与 <code class=\"docutils literal notranslate\">.pck</code> 两个文件，分发时必须放在同一目录下；如需合并为单个可执行文件，可在导出预设的 <code class=\"docutils literal notranslate\">Binary Format</code> 中勾选 <code class=\"docutils literal notranslate\">Embed PCK</code>。</li>\n</ol>\n<hr>\n<h3 id=\"part-1-s12\">第一篇推荐视频与教程<a class=\"headerlink\" href=\"#part-1/part-1-s12\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"admonition seealso\"><p class=\"admonition-title\">推荐学习资料</p>\n<p><strong>推荐视频 1：跟着 Brackeys 学习用 Godot 制作第一款游戏，国外经典教程中文搬运版</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1fs421N7TD\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1fs421N7TD</a></p>\n<ul>\n<li><strong>内容定位</strong>：完整的零基础 2D 平台跳跃入门全流程，节奏紧凑，适合作为第一个上手项目。</li>\n<li><strong>学习目标</strong>：掌握编辑器基本操作、场景与节点组合、精灵动画、碰撞检测、金币拾取与计分流程。</li>\n<li><strong>补充说明</strong>：视频录制于 Godot 4.2 时期，若其中使用旧版 <code class=\"docutils literal notranslate\">TileMap</code> 节点，在 Godot 4.3 及以上版本中应替换为 <code class=\"docutils literal notranslate\">TileMapLayer</code>。</li>\n</ul>\n<p><strong>推荐视频 2：国内 Godot 4 2D 游戏开发入门实战教程</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1fuCrYFEoG\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1fuCrYFEoG</a></p>\n<ul>\n<li><strong>内容定位</strong>：中文原生录制的 Godot 2D 入门实战课程，配有完整项目与素材练习，可与上方 Brackeys 教程互为补充或二选一跟练。</li>\n<li><strong>学习目标</strong>：熟悉 Godot 编辑器工作流、基础节点用法与完整 2D 小游戏的搭建步骤。</li>\n<li><strong>补充说明</strong>：适合更习惯中文原声讲解的初学者作为入门主线。</li>\n</ul>\n<p><strong>推荐视频 3：GDScript 语法系统讲解</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1fx4y1p79u\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1fx4y1p79u</a></p>\n<ul>\n<li><strong>内容定位</strong>：专门针对 GDScript 语言本身的基础语法教学。</li>\n<li><strong>学习目标</strong>：掌握变量、函数、流程控制、静态类型注解、数组与字典、信号与节点引用等核心语法。</li>\n<li><strong>补充说明</strong>：适合在跟练实战视频前先快速通览一遍语法，或在写代码卡壳时作为专项查阅资料。</li>\n</ul>\n<p><strong>推荐视频 4：All 219 Godot Nodes Explained In 42 Minutes，Lukky</strong><br>\nB站搬运链接：<a href=\"https://www.bilibili.com/video/BV1MY4GzYEKC\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1MY4GzYEKC</a><br>\nYouTube 原版链接：<a href=\"https://www.youtube.com/watch?v=tO2gthp45MA\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.youtube.com/watch?v=tO2gthp45MA</a></p>\n<ul>\n<li><strong>内容定位</strong>：42 分钟全景式速览 Godot 内置的 219 个核心、2D、3D 与 UI 节点功能，对应本篇 1.2 节的节点体系认识。</li>\n<li><strong>学习目标</strong>：在跑通第一个小游戏后建立对 Godot 内置能力边界的整体认知，明确各类常见需求已有现成节点可用，避免重复造轮子；观看时以建立索引印象为主，无需死记硬背。</li>\n</ul>\n</div>\n<div id=\"part-1-s13\" class=\"admonition tip\"><p class=\"admonition-title\">第一篇能力自检</p><p>完成本篇学习后，应当具备以下能力：</p>\n<ul>\n<li>熟悉编辑器核心面板与场景树思维，能够通过 <kbd class=\"kbd docutils literal notranslate\">F1</kbd> 内置文档按需查找节点与接口，不再依赖死记硬背。</li>\n<li>能够编写带静态类型注解的 GDScript，理解节点生命周期、<code class=\"docutils literal notranslate\">_process</code> 与 <code class=\"docutils literal notranslate\">_physics_process</code> 的区别，并能使用信号完成基础的节点通信。</li>\n<li>能够合理选择物理与检测节点，正确配置 Collision Layer、Mask 与 <code class=\"docutils literal notranslate\">InputMap</code>，独立从零搭建并导出一个包含完整玩法循环的 2D 小游戏。</li>\n</ul></div>\n","plainText":"第一篇：引擎基石与最小闭环 本篇目标 熟悉编辑器布局，理解节点、场景与信号三大核心机制，写出带静态类型的 GDScript，并跑通从新建工程到导出运行文件的完整流程。 1.1 编辑器五大核心面板 打开 Godot 后，界面主要分为五个工作区： Scene 场景面板 ：位于左上角，用于管理当前场景的节点树结构。 FileSystem 文件系统 ：位于左下角，用于管理项目内所有资源， res:// 表示项目根目录。 Viewport 主视口 ：位于中央，可在 2D、3D、Script 脚本和 AssetLib 资源库之间切换。 Inspector 检查器 ：位于右侧，用于查看和修改选中节点的属性；旁边的 Node 标签页用于管理信号和分组。 底部面板 ：包含 Output 输出日志、Debugger 调试器、Audio 音频总线和 Animation 动画编辑器。 1.2 Godot 的核心：节点与场景树 Godot 的基本模型非常纯粹：整个游戏运行在一棵场景树上，树上的最小功能单元叫 节点 Node ，把一组节点保存为 .tscn 文件供复用就叫 场景 Scene 。 场景既是关卡，也是可复用的预制体。主角是一个场景，一颗子弹是一个场景，一张地图也是一个场景，可以把主角场景直接拖进地图场景中嵌套使用。 学习初期不需要去背诵上百个节点，先记住四大基类，通过图标颜色就能一眼分辨： 基类 图标颜色 作用与定位 常见子类举例 Node 白色 纯逻辑节点，没有空间坐标 Timer 、 AnimationPlayer 、 AudioStreamPlayer Node2D 蓝色 所有 2D 对象的基类，带有平面位置、旋转与缩放 Sprite2D 、 CharacterBody2D 、 Area2D 、 Camera2D 、 TileMapLayer Node3D 红色 所有 3D 对象的基类，带有三维变换 MeshInstance3D 、 CharacterBody3D 、 Camera3D 、 DirectionalLight3D Control 绿色 所有 UI 元素的基类，支持锚点与容器布局 Button 、 Label 、 TextureRect 、 VBoxContainer 、 Panel 1.3 GDScript 核心语法与静态类型规范 GDScript 语法接近 Python，在工程实践中应当从一开始就使用 静态类型注解 ： 编辑器能提供准确的代码自动补全； 类型写错在编辑阶段就会直接提示，不必等到运行时崩溃； 在 Godot 4 中，静态类型代码的执行效率明显高于动态类型。 建议打开设置： Editor -> Editor Settings -> Text Editor -> Completion -> Add Type Hints ，让编辑器自动补充类型提示。 GDScript class_name Player # 注册全局类名，方便其他脚本做类型注解 extends CharacterBody2D # @export 将变量暴露到右侧 Inspector 面板，方便直接调参 @export var move_speed : float = 220.0 @export var max_hp : int = 100 # @onready 在所有子节点准备就绪后再获取引用 @onready var sprite : Sprite2D = $ Sprite2D @onready var anim : AnimationPlayer = $ AnimationPlayer # 显式声明类型与使用 := 进行类型推断 var current_hp : int = 100 var is_invincible : bool = false func take_damage ( amount : int ) -> void : if is_invincible : return current_hp = maxi ( current_hp - amount , 0 ) var ratio := float ( current_hp ) / float ( max_hp ) print ( \"当前血量比例: %.2f\" % ratio ) 再记住两个高频用法： await ：异步等待某个信号触发，例如延迟 1 秒再继续执行： GDScript await get_tree (). create_timer ( 1.0 ). timeout print ( \"1 秒后执行这里\" ) queue_free() ：在当前帧结束后安全销毁节点，通常不要直接调用 free() 。 1.4 生命周期与帧循环 节点从加入场景树到离开场景树，引擎会按固定顺序调用以下回调函数： 回调函数 触发时机与顺序 典型用途 _init() 对象在内存中创建时，尚未进入场景树 初始化纯数据 _enter_tree() 节点进入场景树时，父节点先于子节点执行 注册到全局管理器 _ready() 该节点及其全部子节点都进入树后，子节点先于父节点执行 获取子节点引用、初始化状态、连接信号 _process(delta) 每个渲染帧调用一次，频率随硬件帧率波动 UI 刷新、动画与非物理逻辑 _physics_process(delta) 按固定物理帧率调用，默认 60Hz 角色移动、碰撞判断与物理受力 _exit_tree() 节点离开场景树时 清理外部引用 在 _process 和 _physics_process 中计算位移时，需要乘以 delta 也就是上一帧的耗时，才能保证 60 帧和 144 帧设备上的移动速度一致。唯一要注意的是， CharacterBody2D.move_and_slide() 内部已经乘过 delta ，给 velocity 赋值时不需要再乘一次。 1.5 信号系统 信号是 Godot 内置的观察者机制，用来在节点之间解耦通信：发送方只需在状态变化时广播事件，无需关心外部有哪些节点在监听。 GDScript # 在 Player.gd 中定义并发出信号 signal health_changed ( new_hp : int , max_hp : int ) signal died func take_damage ( amount : int ) -> void : current_hp = maxi ( current_hp - amount , 0 ) health_changed . emit ( current_hp , max_hp ) if current_hp == 0 : died . emit () GDScript # 在 HUD.gd 或父场景中连接信号，推荐用代码连接以便追踪调用关系 func _ready () -> void : player . health_changed . connect ( _on_player_health_changed ) func _on_player_health_changed ( new_hp : int , max_hp : int ) -> void : hp_bar . max_value = max_hp hp_bar . value = new_hp 1.6 物理、碰撞与输入 四类常用物理与检测节点 StaticBody2D/3D ：静止不动的墙体与地面。 CharacterBody2D/3D ：由代码精确控制移动的角色和敌人，配合 velocity 与 move_and_slide() 使用。 RigidBody2D/3D ：交由物理引擎模拟重力、碰撞和弹跳的箱子或碎石，应通过 apply_impulse 或 apply_force 施加力，不要直接改坐标。 Area2D/3D ：不产生物理阻挡，专门用于区域检测，适合做金币拾取、攻击判定框、传送门和敌人视野。 以上四类节点都必须挂载一个 CollisionShape2D 或 CollisionShape3D 子节点并设置碰撞形状，否则不会生效。 Collision Layer 与 Mask 的区分 通常先在 Project Settings -> Layer Names -> 2D Physics 中为各层命名，例如 1 为 World、2 为 Player、3 为 Enemy、4 为 PlayerBullet。 Layer 层 ：定义对象自身所属的碰撞分类。例如主角勾选第 2 层，标识其属于 Player 类别。 Mask 掩码 ：定义对象会与哪些分类发生碰撞或检测。例如主角勾选第 1 层和第 3 层，表示主角会被墙壁阻挡并与敌人碰撞，但不会与自身发射的子弹产生碰撞。 输入系统： InputMap 与输入传播 永远在 Project Settings -> Input Map 里定义语义化动作，例如 move_left 、 jump 、 attack ，不要在代码里写死键盘按键。 八方向移动推荐使用 Input.get_vector() ，它会自动做归一化处理，避免斜向移动比直线更快： GDScript func _physics_process ( _delta : float ) -> void : var dir := Input . get_vector ( \"move_left\" , \"move_right\" , \"move_up\" , \"move_down\" ) velocity = dir * move_speed move_and_slide () 此外要区分 _input(event) 和 _unhandled_input(event) ： _input 最先接收所有输入，哪怕点击的是 UI 按钮也会触发。 _unhandled_input 只接收没有被 UI 消费的输入。角色攻击、交互这类游戏内按键应放在 _unhandled_input 中，避免点击界面按钮时角色在背后误触发攻击。 1.7 最小导出流程 完成第一个可玩原型后，按以下三步即可跑通桌面端导出流程： 安装导出模板 ：点击顶部菜单 Editor -> Manage Export Templates ，点击 Download and Install 下载并安装与当前引擎版本号完全一致的导出模板。 创建导出预设 ：打开 Project -> Export ，点击 Add... 添加目标平台，例如 Windows Desktop ，确认主场景已在项目设置中正确指定。 打包生成可执行文件 ：点击 Export Project 选择输出路径并导出。默认会生成 .exe 与 .pck 两个文件，分发时必须放在同一目录下；如需合并为单个可执行文件，可在导出预设的 Binary Format 中勾选 Embed PCK 。 第一篇推荐视频与教程 推荐学习资料 推荐视频 1：跟着 Brackeys 学习用 Godot 制作第一款游戏，国外经典教程中文搬运版 链接： https://www.bilibili.com/video/BV1fs421N7TD 内容定位 ：完整的零基础 2D 平台跳跃入门全流程，节奏紧凑，适合作为第一个上手项目。 学习目标 ：掌握编辑器基本操作、场景与节点组合、精灵动画、碰撞检测、金币拾取与计分流程。 补充说明 ：视频录制于 Godot 4.2 时期，若其中使用旧版 TileMap 节点，在 Godot 4.3 及以上版本中应替换为 TileMapLayer 。 推荐视频 2：国内 Godot 4 2D 游戏开发入门实战教程 链接： https://www.bilibili.com/video/BV1fuCrYFEoG 内容定位 ：中文原生录制的 Godot 2D 入门实战课程，配有完整项目与素材练习，可与上方 Brackeys 教程互为补充或二选一跟练。 学习目标 ：熟悉 Godot 编辑器工作流、基础节点用法与完整 2D 小游戏的搭建步骤。 补充说明 ：适合更习惯中文原声讲解的初学者作为入门主线。 推荐视频 3：GDScript 语法系统讲解 链接： https://www.bilibili.com/video/BV1fx4y1p79u 内容定位 ：专门针对 GDScript 语言本身的基础语法教学。 学习目标 ：掌握变量、函数、流程控制、静态类型注解、数组与字典、信号与节点引用等核心语法。 补充说明 ：适合在跟练实战视频前先快速通览一遍语法，或在写代码卡壳时作为专项查阅资料。 推荐视频 4：All 219 Godot Nodes Explained In 42 Minutes，Lukky B站搬运链接： https://www.bilibili.com/video/BV1MY4GzYEKC YouTube 原版链接： https://www.youtube.com/watch?v=tO2gthp45MA 内容定位 ：42 分钟全景式速览 Godot 内置的 219 个核心、2D、3D 与 UI 节点功能，对应本篇 1.2 节的节点体系认识。 学习目标 ：在跑通第一个小游戏后建立对 Godot 内置能力边界的整体认知，明确各类常见需求已有现成节点可用，避免重复造轮子；观看时以建立索引印象为主，无需死记硬背。 第一篇能力自检 完成本篇学习后，应当具备以下能力： 熟悉编辑器核心面板与场景树思维，能够通过 F1 内置文档按需查找节点与接口，不再依赖死记硬背。 能够编写带静态类型注解的 GDScript，理解节点生命周期、 _process 与 _physics_process 的区别，并能使用信号完成基础的节点通信。 能够合理选择物理与检测节点，正确配置 Collision Layer、Mask 与 InputMap ，独立从零搭建并导出一个包含完整玩法循环的 2D 小游戏。"},{"id":"part-2","group":"新手入门","title":"第二篇：构建完整体验的核心子系统","shortTitle":"第二篇：核心子系统与体验","summary":"TileMapLayer 地图、AnimationPlayer 与 Tween、UI 多分辨率适配、Audio Bus 音频总线与基础操作手感。","sections":[{"id":"part-2-s2","title":"2.1 高频核心节点精讲"},{"id":"part-2-s6","title":"2.2 UI 系统与多分辨率适配"},{"id":"part-2-s9","title":"2.3 音频系统与 Audio Bus"},{"id":"part-2-s10","title":"2.4 游戏手感与细节打磨"},{"id":"part-2-s11","title":"第二篇推荐视频与参考资料"},{"id":"part-2-s12","title":"第二篇能力自检"}],"html":"<h1 id=\"part-2-s1\">第二篇：构建完整体验的核心子系统</h1>\n<div class=\"admonition note\"><p class=\"admonition-title\">本篇目标</p><p>掌握地图搭建、动画系统、UI 多分辨率适配、音频总线与基础操作手感，做出一个结构完整、体验流畅的 Demo。</p></div>\n<h3 id=\"part-2-s2\">2.1 高频核心节点精讲<a class=\"headerlink\" href=\"#part-2/part-2-s2\" title=\"永久链接至标题\">¶</a></h3>\n<h4 id=\"part-2-s3\">1. 关卡与镜头<a class=\"headerlink\" href=\"#part-2/part-2-s3\" title=\"永久链接至标题\">¶</a></h4>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">TileMapLayer</code></strong>：Godot 4.3 起的新标准，用来替代已弃用的单节点多图层 <code class=\"docutils literal notranslate\">TileMap</code>。每个图层都是独立的 <code class=\"docutils literal notranslate\">TileMapLayer</code> 节点，如地面层、墙壁层、装饰层，管理层级与碰撞更直观。</li>\n<li><strong><code class=\"docutils literal notranslate\">Camera2D</code></strong>：开启 <code class=\"docutils literal notranslate\">Position Smoothing</code> 可实现镜头平滑跟随；通过 <code class=\"docutils literal notranslate\">Limit</code> 限制边界，防止镜头拍到地图外的空白区域。</li>\n</ul>\n<h4 id=\"part-2-s4\">2. 动画与补间：<code class=\"docutils literal notranslate\">AnimatedSprite2D</code>、<code class=\"docutils literal notranslate\">AnimationPlayer</code>、<code class=\"docutils literal notranslate\">Tween</code><a class=\"headerlink\" href=\"#part-2/part-2-s4\" title=\"永久链接至标题\">¶</a></h4>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">AnimatedSprite2D</code></strong>：适合简单的序列帧动画，上手快，但扩展性有限。</li>\n<li><strong><code class=\"docutils literal notranslate\">AnimationPlayer</code></strong>：Godot 中非常核心的节点，不仅能播放帧动画，还能给任意节点的任意属性设置关键帧，包括缩放、颜色、粒子开关和碰撞框启停。更实用的是 <strong>Call Method Track</strong>，例如在挥剑动画的第 0.15 秒精准调用 <code class=\"docutils literal notranslate\">enable_hitbox()</code>，第 0.30 秒调用 <code class=\"docutils literal notranslate\">disable_hitbox()</code>，比手写计时器清晰得多。</li>\n<li><strong><code class=\"docutils literal notranslate\">AnimationTree</code></strong>：用于管理复杂的动画状态切换与混合，如八方向混合树和 3D 骨骼融合。</li>\n<li><strong><code class=\"docutils literal notranslate\">Tween</code></strong>：纯代码补间动画，非常适合制作按钮弹跳、受击挤压拉伸、伤害数字飘动等效果：</li>\n</ul>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">play_hit_squash</span>() -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">tween</span> := <span style=\"color:#57b3ff\">create_tween</span>().<span style=\"color:#57b3ff\">set_ease</span>(<span style=\"color:#c7ffed\">Tween</span>.<span style=\"color:#c7ffed\">EASE_OUT</span>).<span style=\"color:#57b3ff\">set_trans</span>(<span style=\"color:#c7ffed\">Tween</span>.<span style=\"color:#c7ffed\">TRANS_ELASTIC</span>)\n\t<span style=\"color:#bce0ff\">sprite</span>.<span style=\"color:#bce0ff\">scale</span> = <span style=\"color:#a3a3f5\">Vector2</span>(<span style=\"color:#a1ffe0\">1.3</span>, <span style=\"color:#a1ffe0\">0.7</span>)\n\t<span style=\"color:#bce0ff\">tween</span>.<span style=\"color:#57b3ff\">tween_property</span>(<span style=\"color:#bce0ff\">sprite</span>, <span style=\"color:#ffeda1\">\"scale\"</span>, <span style=\"color:#42ffc2\">Vector2</span>.<span style=\"color:#c7ffed\">ONE</span>, <span style=\"color:#a1ffe0\">0.25</span>)</code></pre></div></div></div></div>\n<h4 id=\"part-2-s5\">3. 氛围表现<a class=\"headerlink\" href=\"#part-2/part-2-s5\" title=\"永久链接至标题\">¶</a></h4>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">GPUParticles2D/3D</code></strong>：用于制作脚步扬尘、受击火花、雨雪等粒子效果，性能开销低。</li>\n<li><strong><code class=\"docutils literal notranslate\">PointLight2D</code> 与 <code class=\"docutils literal notranslate\">CanvasModulate</code></strong>：用来实现 2D 昼夜变化和局部光照。</li>\n</ul>\n<h3 id=\"part-2-s6\">2.2 UI 系统与多分辨率适配<a class=\"headerlink\" href=\"#part-2/part-2-s6\" title=\"永久链接至标题\">¶</a></h3>\n<p>窗口拉伸或切换全屏时，未正确配置的界面容易出现布局错位。解决多分辨率适配主要依靠两项机制：</p>\n<h4 id=\"part-2-s7\">1. 窗口缩放模式设置<a class=\"headerlink\" href=\"#part-2/part-2-s7\" title=\"永久链接至标题\">¶</a></h4>\n<p>打开 <code class=\"docutils literal notranslate\">Project Settings -&gt; Display -&gt; Window -&gt; Stretch</code>：</p>\n<ul>\n<li><strong>常规高清 2D 或矢量 UI 游戏</strong>：<code class=\"docutils literal notranslate\">Mode</code> 设为 <code class=\"docutils literal notranslate\">canvas_items</code>，<code class=\"docutils literal notranslate\">Aspect</code> 设为 <code class=\"docutils literal notranslate\">expand</code> 或 <code class=\"docutils literal notranslate\">keep</code>。</li>\n<li><strong>像素风游戏</strong>：<code class=\"docutils literal notranslate\">Mode</code> 设为 <code class=\"docutils literal notranslate\">viewport</code>，<code class=\"docutils literal notranslate\">Aspect</code> 设为 <code class=\"docutils literal notranslate\">keep</code>，同时将 <code class=\"docutils literal notranslate\">Project Settings -&gt; Rendering -&gt; Textures -&gt; Canvas Textures -&gt; Default Texture Filter</code> 设为 <code class=\"docutils literal notranslate\">Nearest</code>，防止像素画面发糊。</li>\n</ul>\n<h4 id=\"part-2-s8\">2. 用容器排版，减少手拖坐标<a class=\"headerlink\" href=\"#part-2/part-2-s8\" title=\"永久链接至标题\">¶</a></h4>\n<p>尽量使用绿色 <code class=\"docutils literal notranslate\">Container</code> 容器节点管理界面布局：</p>\n<ul>\n<li><code class=\"docutils literal notranslate\">MarginContainer</code>：控制整体四周留白，常用于让 HUD 与屏幕边缘保持安全距离。</li>\n<li><code class=\"docutils literal notranslate\">VBoxContainer</code> 与 <code class=\"docutils literal notranslate\">HBoxContainer</code>：自动垂直或水平排列按钮与状态条。</li>\n<li><code class=\"docutils literal notranslate\">GridContainer</code>：适合制作背包格子与技能栏。</li>\n<li><code class=\"docutils literal notranslate\">CenterContainer</code>：将弹窗或提示框居中。</li>\n<li><strong>Anchor 锚点</strong>：通过顶部工具栏的锚点预设，将 HUD 固定在屏幕四角或四边；全屏遮罩背景选择 <code class=\"docutils literal notranslate\">Full Rect</code>。</li>\n<li><strong><code class=\"docutils literal notranslate\">Theme</code> 主题资源</strong>：统一全游戏的字体、按钮样式和配色，挂载在根 <code class=\"docutils literal notranslate\">Control</code> 上即可让所有子控件自动继承。</li>\n<li><strong><code class=\"docutils literal notranslate\">CanvasLayer</code></strong>：游戏内 HUD 必须放在 <code class=\"docutils literal notranslate\">CanvasLayer</code> 下，这样界面才不会跟随 <code class=\"docutils literal notranslate\">Camera2D</code> 移动。</li>\n</ul>\n<h3 id=\"part-2-s9\">2.3 音频系统与 Audio Bus<a class=\"headerlink\" href=\"#part-2/part-2-s9\" title=\"永久链接至标题\">¶</a></h3>\n<p>不要把所有声音都放在默认的 <code class=\"docutils literal notranslate\">Master</code> 轨道里。正确做法如下：</p>\n<ol>\n<li>打开底部 <strong>Audio</strong> 面板，新建 <code class=\"docutils literal notranslate\">BGM</code> 和 <code class=\"docutils literal notranslate\">SFX</code> 两条音频总线，输出均指向 <code class=\"docutils literal notranslate\">Master</code>。</li>\n<li>背景音乐节点的 <code class=\"docutils literal notranslate\">Bus</code> 属性设为 <code class=\"docutils literal notranslate\">BGM</code>，音效节点的 <code class=\"docutils literal notranslate\">Bus</code> 属性设为 <code class=\"docutils literal notranslate\">SFX</code>。</li>\n<li>设置界面的音量滑块范围设为 <code class=\"docutils literal notranslate\">0.0</code> 到 <code class=\"docutils literal notranslate\">1.0</code>，代码中使用 <code class=\"docutils literal notranslate\">linear_to_db()</code> 换算成分贝，因为人耳对响度是对数感知，直接线性修改 dB 听感会不自然：</li>\n</ol>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">set_bus_volume</span>(<span style=\"color:#bce0ff\">bus_name</span>: <span style=\"color:#42ffc2\">String</span>, <span style=\"color:#bce0ff\">linear_value</span>: <span style=\"color:#42ffc2\">float</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">bus_idx</span> := <span style=\"color:#c7ffed\">AudioServer</span>.<span style=\"color:#57b3ff\">get_bus_index</span>(<span style=\"color:#bce0ff\">bus_name</span>)\n\t<span style=\"color:#c7ffed\">AudioServer</span>.<span style=\"color:#57b3ff\">set_bus_volume_db</span>(<span style=\"color:#bce0ff\">bus_idx</span>, <span style=\"color:#57b3ff\">linear_to_db</span>(<span style=\"color:#bce0ff\">linear_value</span>))\n\t<span style=\"color:#c7ffed\">AudioServer</span>.<span style=\"color:#57b3ff\">set_bus_mute</span>(<span style=\"color:#bce0ff\">bus_idx</span>, <span style=\"color:#bce0ff\">linear_value</span> &lt;= <span style=\"color:#a1ffe0\">0.001</span>)</code></pre></div></div></div></div>\n<h3 id=\"part-2-s10\">2.4 游戏手感与细节打磨<a class=\"headerlink\" href=\"#part-2/part-2-s10\" title=\"永久链接至标题\">¶</a></h3>\n<p>决定一款 Demo 玩起来是否顺手，往往在于以下几个经典机制：</p>\n<ul>\n<li><strong>土狼时间 Coyote Time</strong>：角色离开平台边缘后的 0.1 秒内仍然允许起跳，减少极限起跳时的挫败感。</li>\n<li><strong>跳跃缓冲 Jump Buffer</strong>：落地前 0.1 秒内提前按下跳跃键，落地瞬间自动触发起跳。</li>\n<li><strong>可变跳跃高度</strong>：玩家在上升阶段提前松开跳跃键时，将竖直速度减半，实现轻按小跳、长按大跳。</li>\n<li><strong>顿帧与震屏</strong>：命中敌人时暂停极短时间如 0.05 秒，配合轻微的相机偏移抖动与粒子爆发，能显著增强打击感。</li>\n</ul>\n<hr>\n<h3 id=\"part-2-s11\">第二篇推荐视频与参考资料<a class=\"headerlink\" href=\"#part-2/part-2-s11\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"admonition seealso\"><p class=\"admonition-title\">推荐学习资料</p>\n<p><strong>推荐视频：Godot 2D 实战：从零开发俯视角射击游戏</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV11ngh6xE3s\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV11ngh6xE3s</a></p>\n<ul>\n<li><strong>前置要求</strong>：适合在掌握第一篇 Godot 基础后开始跟练。</li>\n<li><strong>内容定位</strong>：以《元气骑士》《挺进地牢》为参考，从零搭建完整的 2D 俯视角肉鸽射击游戏核心框架。</li>\n<li><strong>覆盖内容</strong>：可复用角色与脚本、动态敌人 AI、远程与近战武器系统、完整道具与金币交易系统、随机游走算法地牢生成、宝箱与奖励机制、音效与背景音乐、视觉特效与基础自定义着色器。</li>\n<li><strong>学习目标</strong>：熟练运用节点、信号、场景组合与场景继承，打通核心子系统的协作，并为进入第三篇的数据驱动、设计模式与第四篇的工程架构做好过渡。</li>\n</ul>\n</div>\n<p>此外，在制作本篇 Demo 过程中涉及的具体节点参数与进阶配置，可直接查阅 Godot 官方中文文档对应专题：</p>\n<ul>\n<li><strong>2D 瓦片地图与动画</strong>：重点查阅 <code class=\"docutils literal notranslate\">TileMapLayer</code>、<code class=\"docutils literal notranslate\">AnimationPlayer</code> 与 <code class=\"docutils literal notranslate\">Tween</code>。</li>\n<li><strong>UI 与多分辨率适配</strong>：重点查阅 <code class=\"docutils literal notranslate\">Control</code> 锚点、各类 <code class=\"docutils literal notranslate\">Container</code> 容器与 <code class=\"docutils literal notranslate\">Multiple resolutions</code> 缩放策略。</li>\n<li><strong>音频系统</strong>：重点查阅 Audio Bus 音频总线与 <code class=\"docutils literal notranslate\">AudioServer</code>。</li>\n</ul>\n<div id=\"part-2-s12\" class=\"admonition tip\"><p class=\"admonition-title\">第二篇能力自检</p><p>完成本篇学习后，应当具备以下能力：</p>\n<ul>\n<li>能够综合运用 <code class=\"docutils literal notranslate\">TileMapLayer</code>、<code class=\"docutils literal notranslate\">Camera2D</code>、<code class=\"docutils literal notranslate\">AnimationPlayer</code> 与 <code class=\"docutils literal notranslate\">Tween</code>，搭建具备基本表现力与流畅操作手感的 2D 关卡及角色交互。</li>\n<li>能够使用 <code class=\"docutils literal notranslate\">Control</code> 锚点、<code class=\"docutils literal notranslate\">Container</code> 容器和 <code class=\"docutils literal notranslate\">Stretch Mode</code> 构建多分辨率自适应界面，并理解界面焦点拦截、游戏暂停模式与音频总线分轨的原理。</li>\n<li>能够在不逐行照抄教程的前提下，独立把地图、动画、UI 与音频四个子系统整合成一个结构完整的 2D 可玩 Demo。</li>\n</ul></div>\n","plainText":"第二篇：构建完整体验的核心子系统 本篇目标 掌握地图搭建、动画系统、UI 多分辨率适配、音频总线与基础操作手感，做出一个结构完整、体验流畅的 Demo。 2.1 高频核心节点精讲 1. 关卡与镜头 TileMapLayer ：Godot 4.3 起的新标准，用来替代已弃用的单节点多图层 TileMap 。每个图层都是独立的 TileMapLayer 节点，如地面层、墙壁层、装饰层，管理层级与碰撞更直观。 Camera2D ：开启 Position Smoothing 可实现镜头平滑跟随；通过 Limit 限制边界，防止镜头拍到地图外的空白区域。 2. 动画与补间： AnimatedSprite2D 、 AnimationPlayer 、 Tween AnimatedSprite2D ：适合简单的序列帧动画，上手快，但扩展性有限。 AnimationPlayer ：Godot 中非常核心的节点，不仅能播放帧动画，还能给任意节点的任意属性设置关键帧，包括缩放、颜色、粒子开关和碰撞框启停。更实用的是 Call Method Track ，例如在挥剑动画的第 0.15 秒精准调用 enable_hitbox() ，第 0.30 秒调用 disable_hitbox() ，比手写计时器清晰得多。 AnimationTree ：用于管理复杂的动画状态切换与混合，如八方向混合树和 3D 骨骼融合。 Tween ：纯代码补间动画，非常适合制作按钮弹跳、受击挤压拉伸、伤害数字飘动等效果： GDScript func play_hit_squash () -> void : var tween := create_tween (). set_ease ( Tween . EASE_OUT ). set_trans ( Tween . TRANS_ELASTIC ) sprite . scale = Vector2 ( 1.3 , 0.7 ) tween . tween_property ( sprite , \"scale\" , Vector2 . ONE , 0.25 ) 3. 氛围表现 GPUParticles2D/3D ：用于制作脚步扬尘、受击火花、雨雪等粒子效果，性能开销低。 PointLight2D 与 CanvasModulate ：用来实现 2D 昼夜变化和局部光照。 2.2 UI 系统与多分辨率适配 窗口拉伸或切换全屏时，未正确配置的界面容易出现布局错位。解决多分辨率适配主要依靠两项机制： 1. 窗口缩放模式设置 打开 Project Settings -> Display -> Window -> Stretch ： 常规高清 2D 或矢量 UI 游戏 ： Mode 设为 canvas_items ， Aspect 设为 expand 或 keep 。 像素风游戏 ： Mode 设为 viewport ， Aspect 设为 keep ，同时将 Project Settings -> Rendering -> Textures -> Canvas Textures -> Default Texture Filter 设为 Nearest ，防止像素画面发糊。 2. 用容器排版，减少手拖坐标 尽量使用绿色 Container 容器节点管理界面布局： MarginContainer ：控制整体四周留白，常用于让 HUD 与屏幕边缘保持安全距离。 VBoxContainer 与 HBoxContainer ：自动垂直或水平排列按钮与状态条。 GridContainer ：适合制作背包格子与技能栏。 CenterContainer ：将弹窗或提示框居中。 Anchor 锚点 ：通过顶部工具栏的锚点预设，将 HUD 固定在屏幕四角或四边；全屏遮罩背景选择 Full Rect 。 Theme 主题资源 ：统一全游戏的字体、按钮样式和配色，挂载在根 Control 上即可让所有子控件自动继承。 CanvasLayer ：游戏内 HUD 必须放在 CanvasLayer 下，这样界面才不会跟随 Camera2D 移动。 2.3 音频系统与 Audio Bus 不要把所有声音都放在默认的 Master 轨道里。正确做法如下： 打开底部 Audio 面板，新建 BGM 和 SFX 两条音频总线，输出均指向 Master 。 背景音乐节点的 Bus 属性设为 BGM ，音效节点的 Bus 属性设为 SFX 。 设置界面的音量滑块范围设为 0.0 到 1.0 ，代码中使用 linear_to_db() 换算成分贝，因为人耳对响度是对数感知，直接线性修改 dB 听感会不自然： GDScript func set_bus_volume ( bus_name : String , linear_value : float ) -> void : var bus_idx := AudioServer . get_bus_index ( bus_name ) AudioServer . set_bus_volume_db ( bus_idx , linear_to_db ( linear_value )) AudioServer . set_bus_mute ( bus_idx , linear_value <= 0.001 ) 2.4 游戏手感与细节打磨 决定一款 Demo 玩起来是否顺手，往往在于以下几个经典机制： 土狼时间 Coyote Time ：角色离开平台边缘后的 0.1 秒内仍然允许起跳，减少极限起跳时的挫败感。 跳跃缓冲 Jump Buffer ：落地前 0.1 秒内提前按下跳跃键，落地瞬间自动触发起跳。 可变跳跃高度 ：玩家在上升阶段提前松开跳跃键时，将竖直速度减半，实现轻按小跳、长按大跳。 顿帧与震屏 ：命中敌人时暂停极短时间如 0.05 秒，配合轻微的相机偏移抖动与粒子爆发，能显著增强打击感。 第二篇推荐视频与参考资料 推荐学习资料 推荐视频：Godot 2D 实战：从零开发俯视角射击游戏 链接： https://www.bilibili.com/video/BV11ngh6xE3s 前置要求 ：适合在掌握第一篇 Godot 基础后开始跟练。 内容定位 ：以《元气骑士》《挺进地牢》为参考，从零搭建完整的 2D 俯视角肉鸽射击游戏核心框架。 覆盖内容 ：可复用角色与脚本、动态敌人 AI、远程与近战武器系统、完整道具与金币交易系统、随机游走算法地牢生成、宝箱与奖励机制、音效与背景音乐、视觉特效与基础自定义着色器。 学习目标 ：熟练运用节点、信号、场景组合与场景继承，打通核心子系统的协作，并为进入第三篇的数据驱动、设计模式与第四篇的工程架构做好过渡。 此外，在制作本篇 Demo 过程中涉及的具体节点参数与进阶配置，可直接查阅 Godot 官方中文文档对应专题： 2D 瓦片地图与动画 ：重点查阅 TileMapLayer 、 AnimationPlayer 与 Tween 。 UI 与多分辨率适配 ：重点查阅 Control 锚点、各类 Container 容器与 Multiple resolutions 缩放策略。 音频系统 ：重点查阅 Audio Bus 音频总线与 AudioServer 。 第二篇能力自检 完成本篇学习后，应当具备以下能力： 能够综合运用 TileMapLayer 、 Camera2D 、 AnimationPlayer 与 Tween ，搭建具备基本表现力与流畅操作手感的 2D 关卡及角色交互。 能够使用 Control 锚点、 Container 容器和 Stretch Mode 构建多分辨率自适应界面，并理解界面焦点拦截、游戏暂停模式与音频总线分轨的原理。 能够在不逐行照抄教程的前提下，独立把地图、动画、UI 与音频四个子系统整合成一个结构完整的 2D 可玩 Demo。"},{"id":"part-3","group":"手册","title":"第三篇：数据驱动与常用设计模式","shortTitle":"第三篇：数据驱动与设计模式","summary":"Custom Resource 自定义资源、有限状态机、节点组件化、EventBus、策略、修饰器与对象池。","sections":[{"id":"part-3-s2","title":"3.1 自定义资源 Custom Resource"},{"id":"part-3-s3","title":"3.2 按痛点学习 Godot 高频设计模式"},{"id":"part-3-s9","title":"第三篇推荐视频与教程"},{"id":"part-3-s10","title":"第三篇能力自检"}],"html":"<h1 id=\"part-3-s1\">第三篇：数据驱动与常用设计模式</h1>\n<div class=\"admonition note\"><p class=\"admonition-title\">本篇目标</p><p>当单个脚本超过几百行、改一处逻辑影响全局时，需要引入数据驱动思想和适合 Godot 的设计模式，让代码保持清晰和可扩展。</p></div>\n<h3 id=\"part-3-s2\">3.1 自定义资源 Custom <code class=\"docutils literal notranslate\">Resource</code><a class=\"headerlink\" href=\"#part-3/part-3-s2\" title=\"永久链接至标题\">¶</a></h3>\n<p>在 Godot 中，继承 <strong><code class=\"docutils literal notranslate\">Resource</code></strong> 的自定义类类似于 Unity 的 ScriptableObject，是实现数据驱动开发的核心手段。武器属性、敌人配置、道具、对话、技能数据都可以保存为 <code class=\"docutils literal notranslate\">.tres</code> 资源文件，在编辑器面板里可视化编辑。</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># weapon_data.gd</span>\n<span style=\"color:#ff7085\">class_name</span> <span style=\"color:#c7ffed\">WeaponData</span>\n<span style=\"color:#ff7085\">extends</span> <span style=\"color:#42ffc2\">Resource</span>\n\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">weapon_name</span>: <span style=\"color:#42ffc2\">String</span> = <span style=\"color:#ffeda1\">\"\"</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">icon</span>: <span style=\"color:#c7ffed\">Texture2D</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">damage</span>: <span style=\"color:#42ffc2\">int</span> = <span style=\"color:#a1ffe0\">10</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">attack_cooldown</span>: <span style=\"color:#42ffc2\">float</span> = <span style=\"color:#a1ffe0\">0.4</span>\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">projectile_scene</span>: <span style=\"color:#42ffc2\">PackedScene</span></code></pre></div></div></div></div>\n<p>写完后，在 FileSystem 面板右键选择 <code class=\"docutils literal notranslate\">Create New -&gt; Resource</code>，搜索 <code class=\"docutils literal notranslate\">WeaponData</code>，就可以直接创建 <code class=\"docutils literal notranslate\">fire_sword.tres</code>、<code class=\"docutils literal notranslate\">ice_bow.tres</code> 等配置文件，再拖入角色脚本的 <code class=\"docutils literal notranslate\">@export var weapon: WeaponData</code> 属性中。</p>\n<div class=\"admonition warning\"><p class=\"admonition-title\">重要注意事项：Resource 的共享引用特性</p><p>同一个 <code class=\"docutils literal notranslate\">.tres</code> 文件默认在内存中是全局共享同一份实例的。如果在运行时直接修改 <code class=\"docutils literal notranslate\">enemy_data.hp -= 10</code>，全地图同种敌人的血量都会同时减少。</p><ul>\n<li><strong>正确做法</strong>：<code class=\"docutils literal notranslate\">Resource</code> 原则上只存放静态配置数据如 <code class=\"docutils literal notranslate\">max_hp</code>，运行时动态变化的数值存在节点自身变量中；如果确实需要每个实例持有独立可修改的副本，应注意 <code class=\"docutils literal notranslate\">Local to Scene</code> 仅对嵌入场景内部的<strong>内联子资源</strong>可靠，对于磁盘上独立的外部 <code class=\"docutils literal notranslate\">.tres</code> 文件，应在代码中显式调用 <code class=\"docutils literal notranslate\">data.duplicate(true)</code> 做深拷贝隔离。</li>\n</ul></div>\n<h3 id=\"part-3-s3\">3.2 按痛点学习 Godot 高频设计模式<a class=\"headerlink\" href=\"#part-3/part-3-s3\" title=\"永久链接至标题\">¶</a></h3>\n<p>学习设计模式不要死背概念，而要看它解决什么实际问题：</p>\n<h4 id=\"part-3-s4\">1. 有限状态机 FSM：解决主角脚本充满 <code class=\"docutils literal notranslate\">if-else</code> 标志位<a class=\"headerlink\" href=\"#part-3/part-3-s4\" title=\"永久链接至标题\">¶</a></h4>\n<p>当代码里开始出现 <code class=\"docutils literal notranslate\">if is_dashing and not is_hurt and not is_climbing and is_on_floor():</code> 这类复杂条件时，就该引入状态机了。</p>\n<p>Godot 中最直观的做法是节点式状态机：</p>\n<div class=\"highlight-default notranslate\"><div class=\"highlight\"><pre class=\"code-diagram\"><code>Player (CharacterBody2D)\n├── Sprite2D\n├── CollisionShape2D\n└── StateMachine (Node)\n    ├── IdleState (Node)\n    ├── MoveState (Node)\n    ├── JumpState (Node)\n    └── AttackState (Node)</code></pre></div></div>\n<p>状态基类模板：</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># state.gd</span>\n<span style=\"color:#ff7085\">class_name</span> <span style=\"color:#c7ffed\">State</span>\n<span style=\"color:#ff7085\">extends</span> <span style=\"color:#42ffc2\">Node</span>\n\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">transitioned</span>(<span style=\"color:#bce0ff\">state</span>: <span style=\"color:#c7ffed\">State</span>, <span style=\"color:#bce0ff\">new_state_name</span>: <span style=\"color:#42ffc2\">String</span>)\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">enter</span>() -&gt; <span style=\"color:#ff7085\">void</span>: <span style=\"color:#ff8ccc\">pass</span>\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">exit</span>() -&gt; <span style=\"color:#ff7085\">void</span>: <span style=\"color:#ff8ccc\">pass</span>\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">update</span>(<span style=\"color:#bce0ff\">_delta</span>: <span style=\"color:#42ffc2\">float</span>) -&gt; <span style=\"color:#ff7085\">void</span>: <span style=\"color:#ff8ccc\">pass</span>\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">physics_update</span>(<span style=\"color:#bce0ff\">_delta</span>: <span style=\"color:#42ffc2\">float</span>) -&gt; <span style=\"color:#ff7085\">void</span>: <span style=\"color:#ff8ccc\">pass</span></code></pre></div></div></div></div>\n<p>每个状态只负责自己的行为和切换条件，通过 <code class=\"docutils literal notranslate\">transitioned.emit(self, \"JumpState\")</code> 通知 <code class=\"docutils literal notranslate\">StateMachine</code> 完成切换，代码职责非常清晰。</p>\n<h4 id=\"part-3-s5\">2. 组件模式：组合优于继承<a class=\"headerlink\" href=\"#part-3/part-3-s5\" title=\"永久链接至标题\">¶</a></h4>\n<p>如果使用深层继承树如 <code class=\"docutils literal notranslate\">Entity -&gt; Damageable -&gt; Character -&gt; Enemy -&gt; FlyingEnemy</code>，一旦需要新增一个“不能移动但可以被打碎的木箱”，继承结构就会变得很别扭。</p>\n<p>Godot 更推崇用子节点组合能力：把通用功能做成独立小场景，按需挂到任意实体下：</p>\n<div class=\"highlight-default notranslate\"><div class=\"highlight\"><pre class=\"code-diagram\"><code>Slime (CharacterBody2D)          WoodenCrate (StaticBody2D)\n├── HealthComponent              ├── HealthComponent\n├── HurtboxComponent (Area2D)    └── HurtboxComponent (Area2D)\n├── HitboxComponent (Area2D)\n└── ChaseAIComponent</code></pre></div></div>\n<p><code class=\"docutils literal notranslate\">HurtboxComponent</code> 负责检测 <code class=\"docutils literal notranslate\">HitboxComponent</code> 的碰撞，收到伤害后通知绑定的 <code class=\"docutils literal notranslate\">HealthComponent</code> 扣血。主角、史莱姆、Boss 和木箱可以完全复用同一套组件代码。</p>\n<h4 id=\"part-3-s6\">3. 观察者模式与 EventBus 事件总线<a class=\"headerlink\" href=\"#part-3/part-3-s6\" title=\"永久链接至标题\">¶</a></h4>\n<p>当深藏在关卡里的敌人死亡，需要同时通知顶层 UI 加分、任务系统计数和相机震屏时，层层向上转发信号会很繁琐。</p>\n<p>可以创建一个只定义信号的 Autoload 单例 <code class=\"docutils literal notranslate\">Events</code>：</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># events.gd，在 Project Settings -&gt; Globals -&gt; Autoload 中注册为 Events</span>\n<span style=\"color:#ff7085\">extends</span> <span style=\"color:#42ffc2\">Node</span>\n\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">enemy_died</span>(<span style=\"color:#bce0ff\">enemy_pos</span>: <span style=\"color:#42ffc2\">Vector2</span>, <span style=\"color:#bce0ff\">score_value</span>: <span style=\"color:#42ffc2\">int</span>)\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">camera_shake_requested</span>(<span style=\"color:#bce0ff\">intensity</span>: <span style=\"color:#42ffc2\">float</span>, <span style=\"color:#bce0ff\">duration</span>: <span style=\"color:#42ffc2\">float</span>)\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">item_picked_up</span>(<span style=\"color:#bce0ff\">item</span>: <span style=\"color:#42ffc2\">Resource</span>)</code></pre></div></div></div></div>\n<p>发射方调用 <code class=\"docutils literal notranslate\">Events.enemy_died.emit(global_position, 100)</code>，需要响应的系统各自连接该信号即可。需要注意的是，父子节点之间的近距离通信仍然优先使用局部信号，只有跨系统、远距离的通知才走全局事件总线。</p>\n<h4 id=\"part-3-s7\">4. 策略模式：搭配 Resource 实现可插拔行为<a class=\"headerlink\" href=\"#part-3/part-3-s7\" title=\"永久链接至标题\">¶</a></h4>\n<p>把不同的发射方式或技能逻辑封装成继承 <code class=\"docutils literal notranslate\">Resource</code> 的策略类，例如 <code class=\"docutils literal notranslate\">SingleShotStrategy</code>、<code class=\"docutils literal notranslate\">ShotgunSpreadStrategy</code>、<code class=\"docutils literal notranslate\">HomingStrategy</code>，统一实现 <code class=\"docutils literal notranslate\">execute(shooter: Node2D, dir: Vector2) -&gt; void</code>。在编辑器里替换一个 <code class=\"docutils literal notranslate\">.tres</code> 文件，就能直接改变武器的攻击方式。</p>\n<h4 id=\"part-3-s8\">5. 修饰器模式、对象池与命令模式<a class=\"headerlink\" href=\"#part-3/part-3-s8\" title=\"永久链接至标题\">¶</a></h4>\n<ul>\n<li><strong>修饰器模式 Decorator</strong>：在不修改原始数值计算逻辑的前提下，按顺序叠加多层数值或行为修正，常用于肉鸽与卡牌游戏中的 Buff、Debuff、遗物与装备词条计算，例如先叠加固定增伤，再乘以易伤或虚弱倍率。</li>\n<li><strong>对象池 Object Pool</strong>：制作弹幕射击或肉鸽游戏时，高频 <code class=\"docutils literal notranslate\">instantiate()</code> 和 <code class=\"docutils literal notranslate\">queue_free()</code> 会造成卡顿。提前创建一批对象放入数组，回收时除了隐藏节点并设为 <code class=\"docutils literal notranslate\">PROCESS_MODE_DISABLED</code>，还必须同步禁用碰撞与区域检测，例如使用 <code class=\"docutils literal notranslate\">set_deferred</code> 关闭 <code class=\"docutils literal notranslate\">CollisionShape2D.disabled</code>，或对 <code class=\"docutils literal notranslate\">Area2D</code> 同时将 <code class=\"docutils literal notranslate\">monitoring</code> 和 <code class=\"docutils literal notranslate\">monitorable</code> 设为 <code class=\"docutils literal notranslate\">false</code>，否则隐藏的对象仍会触发物理碰撞；取出复用时再恢复可见性、处理模式与碰撞状态并重置坐标。</li>\n<li><strong>命令模式 Command</strong>：把每次操作封装成带 <code class=\"docutils literal notranslate\">execute()</code> 与 <code class=\"docutils literal notranslate\">undo()</code> 方法的对象，非常适合推箱子撤回、战棋悔棋或录像回放系统。</li>\n</ul>\n<div class=\"admonition note\"><p class=\"admonition-title\">关于工厂模式的补充</p><p>在传统面向对象语言里常讲抽象工厂，但在 Godot 中，<code class=\"docutils literal notranslate\">PackedScene.instantiate()</code> 配合配置型 <code class=\"docutils literal notranslate\">Resource</code> 本身就承担了轻量化工厂的角色，多数时候无需手写复杂的工厂类层次。</p></div>\n<hr>\n<h3 id=\"part-3-s9\">第三篇推荐视频与教程<a class=\"headerlink\" href=\"#part-3/part-3-s9\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"admonition seealso\"><p class=\"admonition-title\">推荐学习资料</p>\n<p><strong>推荐视频 1：基于《Game Development Patterns with Godot 4》的游戏编程模式教程，中文版一</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1e5dbYHEyJ\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1e5dbYHEyJ</a></p>\n<ul>\n<li><strong>内容定位</strong>：依据 <em>Game Development Patterns with Godot 4</em> 一书制作的中文设计模式系列讲解，结合 Godot 4 实例演示常用游戏编程模式。</li>\n<li><strong>学习目标</strong>：理解有限状态机、观察者、组件化、策略、命令、对象池等模式在 Godot 节点与脚本中的落地方式。</li>\n<li><strong>补充说明</strong>：与下方视频 2 同源，内容体系相近，按偏好的讲解风格任选其一跟学即可。</li>\n</ul>\n<p><strong>推荐视频 2：基于《Game Development Patterns with Godot 4》的游戏编程模式教程，中文版二</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1LsdoBZEgu\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1LsdoBZEgu</a></p>\n<ul>\n<li><strong>内容定位</strong>：同样基于 <em>Game Development Patterns with Godot 4</em> 制作的中文游戏编程模式系列视频。</li>\n<li><strong>学习目标</strong>：掌握常见游戏设计模式的适用场景与 Godot 实现方式，为后续独立搭建中大型项目架构打下基础。</li>\n<li><strong>补充说明</strong>：可与视频 1 对比试看前两集，选择讲解节奏更契合的一套完整跟完。</li>\n</ul>\n</div>\n<div id=\"part-3-s10\" class=\"admonition tip\"><p class=\"admonition-title\">第三篇能力自检</p><p>完成本篇学习后，应当具备以下能力：</p>\n<ul>\n<li>能够清晰区分静态配置数据与运行时状态，熟练使用自定义 <code class=\"docutils literal notranslate\">Resource</code> 将数值与配置从逻辑代码中抽离，并理解资源共享引用机制。</li>\n<li>面对复杂角色行为、多实体能力复用或跨层级通信，能够自主判断是否需要引入有限状态机、组件组合、事件总线、策略或修饰器，避免过度设计或堆砌臃肿的条件判断。</li>\n<li>能够在单脚本出现膨胀趋势时主动重构，将高耦合代码拆分为职责清晰的独立模块。</li>\n</ul></div>\n","plainText":"第三篇：数据驱动与常用设计模式 本篇目标 当单个脚本超过几百行、改一处逻辑影响全局时，需要引入数据驱动思想和适合 Godot 的设计模式，让代码保持清晰和可扩展。 3.1 自定义资源 Custom Resource 在 Godot 中，继承 Resource 的自定义类类似于 Unity 的 ScriptableObject，是实现数据驱动开发的核心手段。武器属性、敌人配置、道具、对话、技能数据都可以保存为 .tres 资源文件，在编辑器面板里可视化编辑。 GDScript # weapon_data.gd class_name WeaponData extends Resource @export var weapon_name : String = \"\" @export var icon : Texture2D @export var damage : int = 10 @export var attack_cooldown : float = 0.4 @export var projectile_scene : PackedScene 写完后，在 FileSystem 面板右键选择 Create New -> Resource ，搜索 WeaponData ，就可以直接创建 fire_sword.tres 、 ice_bow.tres 等配置文件，再拖入角色脚本的 @export var weapon: WeaponData 属性中。 重要注意事项：Resource 的共享引用特性 同一个 .tres 文件默认在内存中是全局共享同一份实例的。如果在运行时直接修改 enemy_data.hp -= 10 ，全地图同种敌人的血量都会同时减少。 正确做法 ： Resource 原则上只存放静态配置数据如 max_hp ，运行时动态变化的数值存在节点自身变量中；如果确实需要每个实例持有独立可修改的副本，应注意 Local to Scene 仅对嵌入场景内部的 内联子资源 可靠，对于磁盘上独立的外部 .tres 文件，应在代码中显式调用 data.duplicate(true) 做深拷贝隔离。 3.2 按痛点学习 Godot 高频设计模式 学习设计模式不要死背概念，而要看它解决什么实际问题： 1. 有限状态机 FSM：解决主角脚本充满 if-else 标志位 当代码里开始出现 if is_dashing and not is_hurt and not is_climbing and is_on_floor(): 这类复杂条件时，就该引入状态机了。 Godot 中最直观的做法是节点式状态机： Player (CharacterBody2D) ├── Sprite2D ├── CollisionShape2D └── StateMachine (Node) ├── IdleState (Node) ├── MoveState (Node) ├── JumpState (Node) └── AttackState (Node) 状态基类模板： GDScript # state.gd class_name State extends Node signal transitioned ( state : State , new_state_name : String ) func enter () -> void : pass func exit () -> void : pass func update ( _delta : float ) -> void : pass func physics_update ( _delta : float ) -> void : pass 每个状态只负责自己的行为和切换条件，通过 transitioned.emit(self, \"JumpState\") 通知 StateMachine 完成切换，代码职责非常清晰。 2. 组件模式：组合优于继承 如果使用深层继承树如 Entity -> Damageable -> Character -> Enemy -> FlyingEnemy ，一旦需要新增一个“不能移动但可以被打碎的木箱”，继承结构就会变得很别扭。 Godot 更推崇用子节点组合能力：把通用功能做成独立小场景，按需挂到任意实体下： Slime (CharacterBody2D) WoodenCrate (StaticBody2D) ├── HealthComponent ├── HealthComponent ├── HurtboxComponent (Area2D) └── HurtboxComponent (Area2D) ├── HitboxComponent (Area2D) └── ChaseAIComponent HurtboxComponent 负责检测 HitboxComponent 的碰撞，收到伤害后通知绑定的 HealthComponent 扣血。主角、史莱姆、Boss 和木箱可以完全复用同一套组件代码。 3. 观察者模式与 EventBus 事件总线 当深藏在关卡里的敌人死亡，需要同时通知顶层 UI 加分、任务系统计数和相机震屏时，层层向上转发信号会很繁琐。 可以创建一个只定义信号的 Autoload 单例 Events ： GDScript # events.gd，在 Project Settings -> Globals -> Autoload 中注册为 Events extends Node signal enemy_died ( enemy_pos : Vector2 , score_value : int ) signal camera_shake_requested ( intensity : float , duration : float ) signal item_picked_up ( item : Resource ) 发射方调用 Events.enemy_died.emit(global_position, 100) ，需要响应的系统各自连接该信号即可。需要注意的是，父子节点之间的近距离通信仍然优先使用局部信号，只有跨系统、远距离的通知才走全局事件总线。 4. 策略模式：搭配 Resource 实现可插拔行为 把不同的发射方式或技能逻辑封装成继承 Resource 的策略类，例如 SingleShotStrategy 、 ShotgunSpreadStrategy 、 HomingStrategy ，统一实现 execute(shooter: Node2D, dir: Vector2) -> void 。在编辑器里替换一个 .tres 文件，就能直接改变武器的攻击方式。 5. 修饰器模式、对象池与命令模式 修饰器模式 Decorator ：在不修改原始数值计算逻辑的前提下，按顺序叠加多层数值或行为修正，常用于肉鸽与卡牌游戏中的 Buff、Debuff、遗物与装备词条计算，例如先叠加固定增伤，再乘以易伤或虚弱倍率。 对象池 Object Pool ：制作弹幕射击或肉鸽游戏时，高频 instantiate() 和 queue_free() 会造成卡顿。提前创建一批对象放入数组，回收时除了隐藏节点并设为 PROCESS_MODE_DISABLED ，还必须同步禁用碰撞与区域检测，例如使用 set_deferred 关闭 CollisionShape2D.disabled ，或对 Area2D 同时将 monitoring 和 monitorable 设为 false ，否则隐藏的对象仍会触发物理碰撞；取出复用时再恢复可见性、处理模式与碰撞状态并重置坐标。 命令模式 Command ：把每次操作封装成带 execute() 与 undo() 方法的对象，非常适合推箱子撤回、战棋悔棋或录像回放系统。 关于工厂模式的补充 在传统面向对象语言里常讲抽象工厂，但在 Godot 中， PackedScene.instantiate() 配合配置型 Resource 本身就承担了轻量化工厂的角色，多数时候无需手写复杂的工厂类层次。 第三篇推荐视频与教程 推荐学习资料 推荐视频 1：基于《Game Development Patterns with Godot 4》的游戏编程模式教程，中文版一 链接： https://www.bilibili.com/video/BV1e5dbYHEyJ 内容定位 ：依据 Game Development Patterns with Godot 4 一书制作的中文设计模式系列讲解，结合 Godot 4 实例演示常用游戏编程模式。 学习目标 ：理解有限状态机、观察者、组件化、策略、命令、对象池等模式在 Godot 节点与脚本中的落地方式。 补充说明 ：与下方视频 2 同源，内容体系相近，按偏好的讲解风格任选其一跟学即可。 推荐视频 2：基于《Game Development Patterns with Godot 4》的游戏编程模式教程，中文版二 链接： https://www.bilibili.com/video/BV1LsdoBZEgu 内容定位 ：同样基于 Game Development Patterns with Godot 4 制作的中文游戏编程模式系列视频。 学习目标 ：掌握常见游戏设计模式的适用场景与 Godot 实现方式，为后续独立搭建中大型项目架构打下基础。 补充说明 ：可与视频 1 对比试看前两集，选择讲解节奏更契合的一套完整跟完。 第三篇能力自检 完成本篇学习后，应当具备以下能力： 能够清晰区分静态配置数据与运行时状态，熟练使用自定义 Resource 将数值与配置从逻辑代码中抽离，并理解资源共享引用机制。 面对复杂角色行为、多实体能力复用或跨层级通信，能够自主判断是否需要引入有限状态机、组件组合、事件总线、策略或修饰器，避免过度设计或堆砌臃肿的条件判断。 能够在单脚本出现膨胀趋势时主动重构，将高耦合代码拆分为职责清晰的独立模块。"},{"id":"part-4","group":"手册","title":"第四篇：项目架构与工程化实践","shortTitle":"第四篇：项目架构与工程化","summary":"Call Down / Signal Up、顶层场景分层、异步加载、存档方案、目录规范、Git 协作与性能调试分析。","sections":[{"id":"part-4-s2","title":"4.1 Godot 惯用整体架构"},{"id":"part-4-s8","title":"4.2 场景管理与存档系统"},{"id":"part-4-s11","title":"4.3 项目目录规范与 Git 团队协作"},{"id":"part-4-s14","title":"4.4 调试、排错与性能分析"},{"id":"part-4-s15","title":"第四篇推荐视频与教程"},{"id":"part-4-s16","title":"第四篇能力自检"}],"html":"<h1 id=\"part-4-s1\">第四篇：项目架构与工程化实践</h1>\n<div class=\"admonition note\"><p class=\"admonition-title\">本篇目标</p><p>能够驾驭包含几十个场景、上百个脚本的中型工程，做到切场景平滑、存档可靠、多人 Git 协作有序、遇到问题能通过调试工具自主定位。</p></div>\n<h3 id=\"part-4-s2\">4.1 Godot 惯用整体架构<a class=\"headerlink\" href=\"#part-4/part-4-s2\" title=\"永久链接至标题\">¶</a></h3>\n<h4 id=\"part-4-s3\">1. 场景树解耦原则：Call Down, Signal Up<a class=\"headerlink\" href=\"#part-4/part-4-s3\" title=\"永久链接至标题\">¶</a></h4>\n<div class=\"arch-svg-wrap\">\n  <svg viewBox=\"0 0 640 190\" width=\"100%\" height=\"190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Call Down, Signal Up 场景树解耦示意图\">\n    <defs>\n      <marker id=\"arrow-down\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n        <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#8cf\"/>\n      </marker>\n      <marker id=\"arrow-up\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n        <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#ee7381\"/>\n      </marker>\n    </defs>\n    <rect x=\"230\" y=\"12\" width=\"180\" height=\"38\" rx=\"4\" class=\"svg-parent-box\"/>\n    <text x=\"320\" y=\"36\" text-anchor=\"middle\" class=\"svg-parent-text\">Parent Node</text>\n    <rect x=\"230\" y=\"140\" width=\"180\" height=\"38\" rx=\"4\" class=\"svg-child-box\"/>\n    <text x=\"320\" y=\"164\" text-anchor=\"middle\" class=\"svg-child-text\">Child Node</text>\n    <line x1=\"362\" y1=\"50\" x2=\"362\" y2=\"134\" stroke=\"#8cf\" stroke-width=\"2\" marker-end=\"url(#arrow-down)\"/>\n    <text x=\"382\" y=\"80\" class=\"svg-tag-down\">1. Call Down</text>\n    <text x=\"382\" y=\"100\" class=\"svg-desc\">父节点直接调用子节点方法</text>\n    <text x=\"382\" y=\"118\" class=\"svg-sub\">父节点明确知晓子节点结构</text>\n    <line x1=\"278\" y1=\"140\" x2=\"278\" y2=\"56\" stroke=\"#ee7381\" stroke-width=\"2\" marker-end=\"url(#arrow-up)\"/>\n    <text x=\"258\" y=\"80\" text-anchor=\"end\" class=\"svg-tag-up\">2. Signal Up</text>\n    <text x=\"258\" y=\"100\" text-anchor=\"end\" class=\"svg-desc\">子节点通过信号向上汇报</text>\n    <text x=\"258\" y=\"118\" text-anchor=\"end\" class=\"svg-sub\">避免写死 get_parent() 强耦合</text>\n  </svg>\n</div>\n<p>坚持这条原则的主要收益在于<strong>子场景可独立运行</strong>。只要子节点不强依赖父节点的具体结构，即可随时按 <kbd class=\"kbd docutils literal notranslate\">F6</kbd> 单独运行主角场景、单个 Boss 或单个 UI 面板进行调试，显著提升开发效率。</p>\n<h4 id=\"part-4-s4\">2. 推荐的场景树顶层分层<a class=\"headerlink\" href=\"#part-4/part-4-s4\" title=\"永久链接至标题\">¶</a></h4>\n<p>不建议直接用 <code class=\"docutils literal notranslate\">get_tree().change_scene_to_file()</code> 把整个场景树整体替换，那样很难保留常驻 UI 和过渡动画。更稳健的做法是保留一个常驻的 <code class=\"docutils literal notranslate\">Main</code> 根场景作为容器：</p>\n<div class=\"highlight-default notranslate\"><div class=\"highlight\"><pre class=\"code-diagram\"><code>Main (Node)\n├── WorldContainer (Node)         # 动态加载与卸载当前关卡场景\n├── UILayer (CanvasLayer)         # HUD、背包、对话等常驻界面\n├── MenuLayer (CanvasLayer)       # 暂停菜单、设置弹窗\n└── TransitionLayer (CanvasLayer) # 黑屏淡入淡出或加载遮罩</code></pre></div></div>\n<h4 id=\"part-4-s5\">3. UI 的数据与视图分离<a class=\"headerlink\" href=\"#part-4/part-4-s5\" title=\"永久链接至标题\">¶</a></h4>\n<p>在界面系统中可以轻量借鉴 MVP 或 MVVM 思想：</p>\n<ul>\n<li><strong>数据层</strong>：保存在 <code class=\"docutils literal notranslate\">Resource</code> 或全局数据对象中，数值变动时发出信号，例如 <code class=\"docutils literal notranslate\">gold_changed</code>。</li>\n<li><strong>视图层</strong>：UI 场景只负责展示和接收按钮点击，不要在 UI 脚本里写扣血或结算伤害的业务规则，只把玩家的操作意图交给数据层或逻辑控制器处理。</li>\n</ul>\n<h4 id=\"part-4-s6\">4. Autoload 全局单例的使用边界<a class=\"headerlink\" href=\"#part-4/part-4-s6\" title=\"永久链接至标题\">¶</a></h4>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">适合做成 Autoload</th>\n<th style=\"text-align:left\">不适合放进 Autoload</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">Events</code> 全局事件总线</td>\n<td style=\"text-align:left\">某个具体关卡里的敌人引用或宝箱状态</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">SceneManager</code> 场景切换与转场管理</td>\n<td style=\"text-align:left\">主角的移动速度与跳跃逻辑</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">AudioManager</code> 全局背景音乐与音效管理</td>\n<td style=\"text-align:left\">互相耦合的零散全局变量</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><code class=\"docutils literal notranslate\">SaveManager</code> 存档读档与用户设置</td>\n<td style=\"text-align:left\">仅在单个场景内部使用的逻辑</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"part-4-s7\">5. 架构辨析：为什么一般不在 Godot 里硬套纯 ECS<a class=\"headerlink\" href=\"#part-4/part-4-s7\" title=\"永久链接至标题\">¶</a></h4>\n<p>在部分游戏开发讨论中，ECS 常被视为高性能架构的代表，但在 Godot 中强行实现一套纯 ECS 通常并不合适，原因在于引擎底层的设计定位不同：</p>\n<ul>\n<li>Godot 的核心是面向对象的场景树与节点组合，物理、渲染、动画和编辑器检视面板都深度围绕节点运作。在 GDScript 里手写 ECS，既无法获得底层连续内存带来的 CPU 缓存优势，又会失去可视化搭建场景和检视调参的便利。</li>\n<li>对于绝大多数独立游戏和中小型项目，<strong>节点组件化 + 自定义 Resource 数据驱动 + Call Down, Signal Up</strong> 就是最贴合 Godot 的架构方案。真遇到万级同屏单位的性能瓶颈时，优先用第五篇提到的 <code class=\"docutils literal notranslate\">MultiMeshInstance2D/3D</code> 与底层 Server API 做局部优化。</li>\n</ul>\n<h3 id=\"part-4-s8\">4.2 场景管理与存档系统<a class=\"headerlink\" href=\"#part-4/part-4-s8\" title=\"永久链接至标题\">¶</a></h3>\n<h4 id=\"part-4-s9\">1. 异步后台加载大场景<a class=\"headerlink\" href=\"#part-4/part-4-s9\" title=\"永久链接至标题\">¶</a></h4>\n<p>当关卡资源较大、同步加载会造成画面卡顿时，使用多线程异步加载配合进度信号：</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDScript</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code style=\"font-family:Consolas,monospace;font-size:12.5px;line-height:1.5;color:
