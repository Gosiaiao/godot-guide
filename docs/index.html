#abb2bf\"><span style=\"color:#ffffff80;font-style:italic\"># scene_loader.gd</span>\n<span style=\"color:#ff7085\">class_name</span> <span style=\"color:#c7ffed\">SceneLoader</span>\n<span style=\"color:#ff7085\">extends</span> <span style=\"color:#42ffc2\">Node</span>\n\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">load_progress_changed</span>(<span style=\"color:#bce0ff\">ratio</span>: <span style=\"color:#42ffc2\">float</span>)\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">scene_loaded</span>(<span style=\"color:#bce0ff\">instance</span>: <span style=\"color:#42ffc2\">Node</span>)\n<span style=\"color:#ff7085\">signal</span> <span style=\"color:#57b3ff\">load_failed</span>(<span style=\"color:#bce0ff\">path</span>: <span style=\"color:#42ffc2\">String</span>)\n\n<span style=\"color:#ffb373\">@export</span> <span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">world_container</span>: <span style=\"color:#42ffc2\">Node</span>\n\n<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">_target_path</span>: <span style=\"color:#42ffc2\">String</span> = <span style=\"color:#ffeda1\">\"\"</span>\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">_ready</span>() -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#57b3ff\">set_process</span>(<span style=\"color:#a1ffe0\">false</span>)\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">load_scene</span>(<span style=\"color:#bce0ff\">path</span>: <span style=\"color:#42ffc2\">String</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#bce0ff\">_target_path</span> = <span style=\"color:#bce0ff\">path</span>\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">err</span> := <span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#57b3ff\">load_threaded_request</span>(<span style=\"color:#bce0ff\">_target_path</span>)\n\t<span style=\"color:#ff8ccc\">if</span> <span style=\"color:#bce0ff\">err</span> != <span style=\"color:#c7ffed\">OK</span>:\n\t\t<span style=\"color:#bce0ff\">load_failed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#bce0ff\">_target_path</span>)\n\t\t<span style=\"color:#ff8ccc\">return</span>\n\t<span style=\"color:#57b3ff\">set_process</span>(<span style=\"color:#a1ffe0\">true</span>)\n\n<span style=\"color:#ff7085\">func</span> <span style=\"color:#66e6ff\">_process</span>(<span style=\"color:#bce0ff\">_delta</span>: <span style=\"color:#42ffc2\">float</span>) -&gt; <span style=\"color:#ff7085\">void</span>:\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">progress</span>: <span style=\"color:#42ffc2\">Array</span> = []\n\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">status</span> := <span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#57b3ff\">load_threaded_get_status</span>(<span style=\"color:#bce0ff\">_target_path</span>, <span style=\"color:#bce0ff\">progress</span>)\n\n\t<span style=\"color:#ff8ccc\">match</span> <span style=\"color:#bce0ff\">status</span>:\n\t\t<span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#c7ffed\">THREAD_LOAD_IN_PROGRESS</span>:\n\t\t\t<span style=\"color:#ff8ccc\">if</span> <span style=\"color:#bce0ff\">progress</span>.<span style=\"color:#57b3ff\">size</span>() &gt; <span style=\"color:#a1ffe0\">0</span>:\n\t\t\t\t<span style=\"color:#bce0ff\">load_progress_changed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#a3a3f5\">float</span>(<span style=\"color:#bce0ff\">progress</span>[0]))\n\t\t<span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#c7ffed\">THREAD_LOAD_LOADED</span>:\n\t\t\t<span style=\"color:#57b3ff\">set_process</span>(<span style=\"color:#a1ffe0\">false</span>)\n\t\t\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">packed_scene</span> := <span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#57b3ff\">load_threaded_get</span>(<span style=\"color:#bce0ff\">_target_path</span>) <span style=\"color:#bce0ff\">as</span> <span style=\"color:#42ffc2\">PackedScene</span>\n\t\t\t<span style=\"color:#ff8ccc\">if</span> <span style=\"color:#bce0ff\">packed_scene</span> == <span style=\"color:#a1ffe0\">null</span>:\n\t\t\t\t<span style=\"color:#bce0ff\">load_failed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#bce0ff\">_target_path</span>)\n\t\t\t\t<span style=\"color:#ff8ccc\">return</span>\n\t\t\t<span style=\"color:#ff8ccc\">for</span> <span style=\"color:#bce0ff\">child</span> <span style=\"color:#ff7085\">in</span> <span style=\"color:#bce0ff\">world_container</span>.<span style=\"color:#57b3ff\">get_children</span>():\n\t\t\t\t<span style=\"color:#bce0ff\">child</span>.<span style=\"color:#57b3ff\">queue_free</span>()\n\t\t\t<span style=\"color:#ff7085\">var</span> <span style=\"color:#bce0ff\">new_scene</span> := <span style=\"color:#bce0ff\">packed_scene</span>.<span style=\"color:#57b3ff\">instantiate</span>()\n\t\t\t<span style=\"color:#bce0ff\">world_container</span>.<span style=\"color:#57b3ff\">add_child</span>(<span style=\"color:#bce0ff\">new_scene</span>)\n\t\t\t<span style=\"color:#bce0ff\">load_progress_changed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#a1ffe0\">1.0</span>)\n\t\t\t<span style=\"color:#bce0ff\">scene_loaded</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#bce0ff\">new_scene</span>)\n\t\t<span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#c7ffed\">THREAD_LOAD_FAILED</span>, <span style=\"color:#c7ffed\">ResourceLoader</span>.<span style=\"color:#c7ffed\">THREAD_LOAD_INVALID_RESOURCE</span>:\n\t\t\t<span style=\"color:#57b3ff\">set_process</span>(<span style=\"color:#a1ffe0\">false</span>)\n\t\t\t<span style=\"color:#bce0ff\">load_failed</span>.<span style=\"color:#57b3ff\">emit</span>(<span style=\"color:#bce0ff\">_target_path</span>)</code></pre></div></div></div></div>\n<h4 id=\"part-4-s10\">2. 常见存档方案对比<a class=\"headerlink\" href=\"#part-4/part-4-s10\" title=\"永久链接至标题\">¶</a></h4>\n<p>存档文件统一写入 <code class=\"docutils literal notranslate\">user://</code> 用户数据目录，不要写入只读的 <code class=\"docutils literal notranslate\">res://</code> 目录。</p>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">方案</th>\n<th style=\"text-align:left\">适用场景</th>\n<th style=\"text-align:left\">优点</th>\n<th style=\"text-align:left\">缺点与注意事项</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">ConfigFile</code></strong></td>\n<td style=\"text-align:left\">游戏设置，如音量、分辨率、键位</td>\n<td style=\"text-align:left\">类 INI 格式，读写简单，易于查看</td>\n<td style=\"text-align:left\">不适合复杂嵌套数据</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">JSON</code>，主存档首选</strong></td>\n<td style=\"text-align:left\">角色进度、背包、关卡解锁</td>\n<td style=\"text-align:left\">通用安全，跨版本兼容好，便于排查</td>\n<td style=\"text-align:left\">需要自行编写字典与对象的转换逻辑</td>\n</tr>\n<tr>\n<td style=\"text-align:left\"><strong><code class=\"docutils literal notranslate\">ResourceSaver</code> 保存为 <code class=\"docutils literal notranslate\">.tres</code></strong></td>\n<td style=\"text-align:left\">本地快速原型测试</td>\n<td style=\"text-align:left\">一行代码即可保存自定义 <code class=\"docutils literal notranslate\">Resource</code></td>\n<td style=\"text-align:left\">安全隐患：<code class=\"docutils literal notranslate\">.tres</code> 可内嵌可执行脚本，不应直接加载外部来源的 <code class=\"docutils literal notranslate\">.tres</code> 存档</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"part-4-s11\">4.3 项目目录规范与 Git 团队协作<a class=\"headerlink\" href=\"#part-4/part-4-s11\" title=\"永久链接至标题\">¶</a></h3>\n<h4 id=\"part-4-s12\">1. 按功能模块组织目录<a class=\"headerlink\" href=\"#part-4/part-4-s12\" title=\"永久链接至标题\">¶</a></h4>\n<p>相比把所有脚本放进 <code class=\"docutils literal notranslate\">scripts/</code>、所有场景放进 <code class=\"docutils literal notranslate\">scenes/</code>，在 Godot 中按功能聚合文件夹更好维护——修改某个实体时，它的场景、脚本、贴图和配置都在同一个目录里：</p>\n<div class=\"highlight-default notranslate\"><div class=\"highlight\"><pre class=\"code-diagram\"><code>res://\n├── autoload/           # 全局单例脚本\n├── common/             # 跨模块复用的通用组件\n├── entities/\n│   ├── player/         # player.tscn、player.gd、贴图与 states/\n│   └── enemies/\n│       └── slime/      # slime.tscn、slime.gd、slime_data.tres\n├── levels/             # 关卡场景与 TileSet\n├── ui/                 # HUD、主菜单、主题资源与字体\n└── resources/          # 武器、道具、技能配置表</code></pre></div></div>\n<h4 id=\"part-4-s13\">2. Git 协作规范<a class=\"headerlink\" href=\"#part-4/part-4-s13\" title=\"永久链接至标题\">¶</a></h4>\n<ol>\n<li><strong><code class=\"docutils literal notranslate\">.gitignore</code> 基础模板</strong>：<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">.gitignore</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code><span style=\"color:rgba(255,255,255,0.5)\"># Godot 4 本地导入缓存与导出凭据，不要提交</span>\n<span style=\"color:rgba(255,255,255,0.85)\">.godot/</span>\n<span style=\"color:rgba(255,255,255,0.85)\"></span>\n<span style=\"color:rgba(255,255,255,0.5)\"># 由 CSV 自动编译生成的本地化二进制文件</span>\n<span style=\"color:rgba(255,255,255,0.85)\">*.translation</span>\n<span style=\"color:rgba(255,255,255,0.85)\"></span>\n<span style=\"color:rgba(255,255,255,0.5)\"># 导出构建产物</span>\n<span style=\"color:rgba(255,255,255,0.85)\">*.exe</span>\n<span style=\"color:rgba(255,255,255,0.85)\">*.pck</span>\n<span style=\"color:rgba(255,255,255,0.85)\"></span>\n<span style=\"color:rgba(255,255,255,0.5)\"># 使用 C# 时的本地缓存</span>\n<span style=\"color:rgba(255,255,255,0.85)\">.mono/</span>\n<span style=\"color:rgba(255,255,255,0.85)\">.vs/</span></code></pre></div></div></div></div>\n说明：Godot 4.1 及以上版本已将导出所需的敏感凭据独立存放在 <code class=\"docutils literal notranslate\">.godot/export_credentials.cfg</code> 并随 <code class=\"docutils literal notranslate\">.godot/</code> 忽略，根目录下的 <code class=\"docutils literal notranslate\">export_presets.cfg</code> 不再包含敏感信息，可直接提交至 Git 供团队共享导出配置。</li>\n<li><strong>保留 <code class=\"docutils literal notranslate\">.uid</code> 文件</strong>：Godot 4.4 及以上版本会为资源生成 <code class=\"docutils literal notranslate\">.uid</code> 文件，用于追踪资源引用，应当正常提交到 Git，不要忽略或手动删除。</li>\n<li><strong>在编辑器内移动文件</strong>：移动或重命名资源时，应在 Godot 的 FileSystem 面板中操作，避免在系统文件夹里直接拖动，以免引发引用丢失。</li>\n<li><strong>减少 <code class=\"docutils literal notranslate\">.tscn</code> 合并冲突</strong>：不要让多人同时修改同一个大场景，应提前拆分好子场景，各自负责独立文件。</li>\n<li><strong>统一命名风格</strong>：文件夹、文件名、变量、函数和信号统一使用全小写蛇形命名 <code class=\"docutils literal notranslate\">snake_case</code>，避免 Windows 不区分大小写但导出包区分大小写引发的路径错误；类名和节点名使用 <code class=\"docutils literal notranslate\">PascalCase</code>。</li>\n</ol>\n<h3 id=\"part-4-s14\">4.4 调试、排错与性能分析<a class=\"headerlink\" href=\"#part-4/part-4-s14\" title=\"永久链接至标题\">¶</a></h3>\n<p>除了 <code class=\"docutils literal notranslate\">print()</code>，平时排查问题要充分利用底部 <strong>Debugger</strong> 面板：</p>\n<ul>\n<li><strong>断点调试</strong>：点击代码行号左侧打断点，暂停执行并逐行检查变量值。</li>\n<li><strong>Remote 远程场景树</strong>：运行游戏时，在左上角 Scene 面板切换到 <strong>Remote</strong> 标签，可以实时查看运行中的完整场景树、动态生成的节点及属性数值，还能边运行边修改参数测试。</li>\n<li><strong>Monitors 监视器</strong>：重点关注 <code class=\"docutils literal notranslate\">Objects -&gt; Orphan Nodes</code> 孤儿节点数量。如果该数值持续增长，说明存在创建后未加入场景树或移除后未释放的节点，即内存泄漏。</li>\n<li><strong>Profiler 性能分析器</strong>：出现掉帧时点击 Start 录制几秒，按耗时排序就能直接定位拖慢帧率的函数。</li>\n</ul>\n<hr>\n<h3 id=\"part-4-s15\">第四篇推荐视频与教程<a class=\"headerlink\" href=\"#part-4/part-4-s15\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"admonition seealso\"><p class=\"admonition-title\">推荐学习资料</p>\n<p><strong>推荐视频：《杀戮尖塔》完整复刻综合实战系列</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1PC411L78f\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1PC411L78f</a></p>\n<ul>\n<li><strong>前置要求</strong>：适合在掌握基础节点用法与常用设计模式之后，作为中大型项目综合实战跟练。</li>\n<li><strong>覆盖内容</strong>：完整拆解了类《杀戮尖塔》项目的整体架构与多系统流程循环，涵盖回合制战斗循环、手牌交互与逻辑解耦、状态机、修饰器数值修正、Custom Resource 数据驱动、意图系统、地图生成与存档等综合开发技能。</li>\n<li><strong>学习目标</strong>：理解中复杂度游戏如何组织模块边界、如何在真实工程中串联多种设计模式与数据驱动架构。</li>\n</ul>\n</div>\n<div id=\"part-4-s16\" class=\"admonition tip\"><p class=\"admonition-title\">第四篇能力自检</p><p>完成本篇学习后，应当具备以下能力：</p>\n<ul>\n<li>能够依据 Call Down, Signal Up 原则划分场景职责，使核心子场景可独立运行调试，并合理规划顶层场景分层与 Autoload 单例边界。</li>\n<li>能够独立设计并实现异步场景切换、用户设置保存与进度存档系统，并理解 Godot 中面向场景树架构与 ECS 等外部范式的边界差异。</li>\n<li>能够按功能模块规范组织工程目录、配置 <code class=\"docutils literal notranslate\">.gitignore</code> 开展多人 Git 协作，并熟练借助断点、Remote 场景树、Monitors 与 Profiler 定位逻辑错误、内存泄漏与性能瓶颈。</li>\n</ul></div>\n","plainText":"第四篇：项目架构与工程化实践 本篇目标 能够驾驭包含几十个场景、上百个脚本的中型工程，做到切场景平滑、存档可靠、多人 Git 协作有序、遇到问题能通过调试工具自主定位。 4.1 Godot 惯用整体架构 1. 场景树解耦原则：Call Down, Signal Up Parent Node Child Node 1. Call Down 父节点直接调用子节点方法 父节点明确知晓子节点结构 2. Signal Up 子节点通过信号向上汇报 避免写死 get_parent() 强耦合 坚持这条原则的主要收益在于 子场景可独立运行 。只要子节点不强依赖父节点的具体结构，即可随时按 F6 单独运行主角场景、单个 Boss 或单个 UI 面板进行调试，显著提升开发效率。 2. 推荐的场景树顶层分层 不建议直接用 get_tree().change_scene_to_file() 把整个场景树整体替换，那样很难保留常驻 UI 和过渡动画。更稳健的做法是保留一个常驻的 Main 根场景作为容器： Main (Node) ├── WorldContainer (Node) # 动态加载与卸载当前关卡场景 ├── UILayer (CanvasLayer) # HUD、背包、对话等常驻界面 ├── MenuLayer (CanvasLayer) # 暂停菜单、设置弹窗 └── TransitionLayer (CanvasLayer) # 黑屏淡入淡出或加载遮罩 3. UI 的数据与视图分离 在界面系统中可以轻量借鉴 MVP 或 MVVM 思想： 数据层 ：保存在 Resource 或全局数据对象中，数值变动时发出信号，例如 gold_changed 。 视图层 ：UI 场景只负责展示和接收按钮点击，不要在 UI 脚本里写扣血或结算伤害的业务规则，只把玩家的操作意图交给数据层或逻辑控制器处理。 4. Autoload 全局单例的使用边界 适合做成 Autoload 不适合放进 Autoload Events 全局事件总线 某个具体关卡里的敌人引用或宝箱状态 SceneManager 场景切换与转场管理 主角的移动速度与跳跃逻辑 AudioManager 全局背景音乐与音效管理 互相耦合的零散全局变量 SaveManager 存档读档与用户设置 仅在单个场景内部使用的逻辑 5. 架构辨析：为什么一般不在 Godot 里硬套纯 ECS 在部分游戏开发讨论中，ECS 常被视为高性能架构的代表，但在 Godot 中强行实现一套纯 ECS 通常并不合适，原因在于引擎底层的设计定位不同： Godot 的核心是面向对象的场景树与节点组合，物理、渲染、动画和编辑器检视面板都深度围绕节点运作。在 GDScript 里手写 ECS，既无法获得底层连续内存带来的 CPU 缓存优势，又会失去可视化搭建场景和检视调参的便利。 对于绝大多数独立游戏和中小型项目， 节点组件化 + 自定义 Resource 数据驱动 + Call Down, Signal Up 就是最贴合 Godot 的架构方案。真遇到万级同屏单位的性能瓶颈时，优先用第五篇提到的 MultiMeshInstance2D/3D 与底层 Server API 做局部优化。 4.2 场景管理与存档系统 1. 异步后台加载大场景 当关卡资源较大、同步加载会造成画面卡顿时，使用多线程异步加载配合进度信号： GDScript # scene_loader.gd class_name SceneLoader extends Node signal load_progress_changed ( ratio : float ) signal scene_loaded ( instance : Node ) signal load_failed ( path : String ) @export var world_container : Node var _target_path : String = \"\" func _ready () -> void : set_process ( false ) func load_scene ( path : String ) -> void : _target_path = path var err := ResourceLoader . load_threaded_request ( _target_path ) if err != OK : load_failed . emit ( _target_path ) return set_process ( true ) func _process ( _delta : float ) -> void : var progress : Array = [] var status := ResourceLoader . load_threaded_get_status ( _target_path , progress ) match status : ResourceLoader . THREAD_LOAD_IN_PROGRESS : if progress . size () > 0 : load_progress_changed . emit ( float ( progress [0])) ResourceLoader . THREAD_LOAD_LOADED : set_process ( false ) var packed_scene := ResourceLoader . load_threaded_get ( _target_path ) as PackedScene if packed_scene == null : load_failed . emit ( _target_path ) return for child in world_container . get_children (): child . queue_free () var new_scene := packed_scene . instantiate () world_container . add_child ( new_scene ) load_progress_changed . emit ( 1.0 ) scene_loaded . emit ( new_scene ) ResourceLoader . THREAD_LOAD_FAILED , ResourceLoader . THREAD_LOAD_INVALID_RESOURCE : set_process ( false ) load_failed . emit ( _target_path ) 2. 常见存档方案对比 存档文件统一写入 user:// 用户数据目录，不要写入只读的 res:// 目录。 方案 适用场景 优点 缺点与注意事项 ConfigFile 游戏设置，如音量、分辨率、键位 类 INI 格式，读写简单，易于查看 不适合复杂嵌套数据 JSON ，主存档首选 角色进度、背包、关卡解锁 通用安全，跨版本兼容好，便于排查 需要自行编写字典与对象的转换逻辑 ResourceSaver 保存为 .tres 本地快速原型测试 一行代码即可保存自定义 Resource 安全隐患： .tres 可内嵌可执行脚本，不应直接加载外部来源的 .tres 存档 4.3 项目目录规范与 Git 团队协作 1. 按功能模块组织目录 相比把所有脚本放进 scripts/ 、所有场景放进 scenes/ ，在 Godot 中按功能聚合文件夹更好维护——修改某个实体时，它的场景、脚本、贴图和配置都在同一个目录里： res:// ├── autoload/ # 全局单例脚本 ├── common/ # 跨模块复用的通用组件 ├── entities/ │ ├── player/ # player.tscn、player.gd、贴图与 states/ │ └── enemies/ │ └── slime/ # slime.tscn、slime.gd、slime_data.tres ├── levels/ # 关卡场景与 TileSet ├── ui/ # HUD、主菜单、主题资源与字体 └── resources/ # 武器、道具、技能配置表 2. Git 协作规范 .gitignore 基础模板 ： .gitignore # Godot 4 本地导入缓存与导出凭据，不要提交 .godot/ # 由 CSV 自动编译生成的本地化二进制文件 *.translation # 导出构建产物 *.exe *.pck # 使用 C# 时的本地缓存 .mono/ .vs/ 说明：Godot 4.1 及以上版本已将导出所需的敏感凭据独立存放在 .godot/export_credentials.cfg 并随 .godot/ 忽略，根目录下的 export_presets.cfg 不再包含敏感信息，可直接提交至 Git 供团队共享导出配置。 保留 .uid 文件 ：Godot 4.4 及以上版本会为资源生成 .uid 文件，用于追踪资源引用，应当正常提交到 Git，不要忽略或手动删除。 在编辑器内移动文件 ：移动或重命名资源时，应在 Godot 的 FileSystem 面板中操作，避免在系统文件夹里直接拖动，以免引发引用丢失。 减少 .tscn 合并冲突 ：不要让多人同时修改同一个大场景，应提前拆分好子场景，各自负责独立文件。 统一命名风格 ：文件夹、文件名、变量、函数和信号统一使用全小写蛇形命名 snake_case ，避免 Windows 不区分大小写但导出包区分大小写引发的路径错误；类名和节点名使用 PascalCase 。 4.4 调试、排错与性能分析 除了 print() ，平时排查问题要充分利用底部 Debugger 面板： 断点调试 ：点击代码行号左侧打断点，暂停执行并逐行检查变量值。 Remote 远程场景树 ：运行游戏时，在左上角 Scene 面板切换到 Remote 标签，可以实时查看运行中的完整场景树、动态生成的节点及属性数值，还能边运行边修改参数测试。 Monitors 监视器 ：重点关注 Objects -> Orphan Nodes 孤儿节点数量。如果该数值持续增长，说明存在创建后未加入场景树或移除后未释放的节点，即内存泄漏。 Profiler 性能分析器 ：出现掉帧时点击 Start 录制几秒，按耗时排序就能直接定位拖慢帧率的函数。 第四篇推荐视频与教程 推荐学习资料 推荐视频：《杀戮尖塔》完整复刻综合实战系列 链接： https://www.bilibili.com/video/BV1PC411L78f 前置要求 ：适合在掌握基础节点用法与常用设计模式之后，作为中大型项目综合实战跟练。 覆盖内容 ：完整拆解了类《杀戮尖塔》项目的整体架构与多系统流程循环，涵盖回合制战斗循环、手牌交互与逻辑解耦、状态机、修饰器数值修正、Custom Resource 数据驱动、意图系统、地图生成与存档等综合开发技能。 学习目标 ：理解中复杂度游戏如何组织模块边界、如何在真实工程中串联多种设计模式与数据驱动架构。 第四篇能力自检 完成本篇学习后，应当具备以下能力： 能够依据 Call Down, Signal Up 原则划分场景职责，使核心子场景可独立运行调试，并合理规划顶层场景分层与 Autoload 单例边界。 能够独立设计并实现异步场景切换、用户设置保存与进度存档系统，并理解 Godot 中面向场景树架构与 ECS 等外部范式的边界差异。 能够按功能模块规范组织工程目录、配置 .gitignore 开展多人 Git 协作，并熟练借助断点、Remote 场景树、Monitors 与 Profiler 定位逻辑错误、内存泄漏与性能瓶颈。"},{"id":"part-5","group":"引擎细节","title":"第五篇：进阶拓展地图","shortTitle":"第五篇：进阶拓展地图","summary":"GDShader 着色器入门、3D 核心差异、性能优化进阶、多人联机概念以及本地化与跨平台导出。","sections":[{"id":"part-5-s2","title":"5.1 Shader 着色器入门"},{"id":"part-5-s3","title":"5.2 3D 开发核心差异"},{"id":"part-5-s4","title":"5.3 性能优化进阶"},{"id":"part-5-s5","title":"5.4 多人联机基础概念"},{"id":"part-5-s6","title":"5.5 本地化与跨平台导出"},{"id":"part-5-s7","title":"第五篇推荐视频与拓展资源"}],"html":"<h1 id=\"part-5-s1\">第五篇：进阶拓展地图</h1>\n<div class=\"admonition note\"><p class=\"admonition-title\">本篇定位</p><p>完成前四篇内容后，即已具备独立开发完整中小型游戏的基础能力。以下五个方向属于按需选修的进阶主题，本篇仅梳理核心概念与学习入口，待实际项目涉及时再深入研究。</p></div>\n<h3 id=\"part-5-s2\">5.1 Shader 着色器入门<a class=\"headerlink\" href=\"#part-5/part-5-s2\" title=\"永久链接至标题\">¶</a></h3>\n<p>Shader 是运行在 GPU 上的小程序，能以很低的性能开销实现丰富的视觉效果。Godot 使用类 GLSL 的 GDShader 语法，2D 声明 <code class=\"docutils literal notranslate\">shader_type canvas_item;</code>，3D 声明 <code class=\"docutils literal notranslate\">shader_type spatial;</code>。</p>\n<p>2D 项目中最实用的四个入门效果是：受击闪白、角色描边、像素溶解、水面波动。</p>\n<p>下面是一个可直接使用的 2D 受击闪白示例。为 <code class=\"docutils literal notranslate\">Sprite2D</code> 添加 <code class=\"docutils literal notranslate\">ShaderMaterial</code> 并填入以下代码，受击时用 <code class=\"docutils literal notranslate\">Tween</code> 将 <code class=\"docutils literal notranslate\">flash_amount</code> 从 <code class=\"docutils literal notranslate\">1.0</code> 过渡到 <code class=\"docutils literal notranslate\">0.0</code> 即可：</p>\n<div class=\"sphinx-tabs\"><div role=\"tablist\"><button class=\"sphinx-tabs-tab code-tab\" role=\"tab\" aria-selected=\"true\" type=\"button\">GDShader</button></div><div class=\"sphinx-tabs-panel code-tab\" role=\"tabpanel\"><div class=\"highlight-gdscript notranslate\"><div class=\"highlight\"><button class=\"copybtn\" type=\"button\" title=\"复制代码\" aria-label=\"复制代码\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg></button><pre class=\"code-dark\"><code><span style=\"color:#ff7085\">shader_type</span> <span style=\"color:#42ffc2\">canvas_item</span>;\n\n<span style=\"color:#ff7085\">uniform</span> <span style=\"color:#42ffc2\">vec4</span> <span style=\"color:#bce0ff\">flash_color</span> : <span style=\"color:#ffb373\">source_color</span> = <span style=\"color:#42ffc2\">vec4</span>(<span style=\"color:#a1ffe0\">1.0</span>, <span style=\"color:#a1ffe0\">1.0</span>, <span style=\"color:#a1ffe0\">1.0</span>, <span style=\"color:#a1ffe0\">1.0</span>);\n<span style=\"color:#ff7085\">uniform</span> <span style=\"color:#42ffc2\">float</span> <span style=\"color:#bce0ff\">flash_amount</span> : <span style=\"color:#ffb373\">hint_range</span>(<span style=\"color:#a1ffe0\">0.0</span>, <span style=\"color:#a1ffe0\">1.0</span>) = <span style=\"color:#a1ffe0\">0.0</span>;\n\n<span style=\"color:#ff7085\">void</span> <span style=\"color:#57b3ff\">fragment</span>() {\n\t<span style=\"color:rgba(255,255,255,0.5)\">// 进入 fragment() 时 COLOR 已包含贴图采样与节点 modulate 染色结果</span>\n\t<span style=\"color:rgba(255,255,255,0.5)\">// 仅混合 COLOR.rgb 可同时保留原始透明度与 modulate 染色效果</span>\n\t<span style=\"color:#c7ffed\">COLOR</span>.<span style=\"color:#bce0ff\">rgb</span> = <span style=\"color:#57b3ff\">mix</span>(<span style=\"color:#c7ffed\">COLOR</span>.<span style=\"color:#bce0ff\">rgb</span>, <span style=\"color:#bce0ff\">flash_color</span>.<span style=\"color:#bce0ff\">rgb</span>, <span style=\"color:#bce0ff\">flash_amount</span>);\n}</code></pre></div></div></div></div>\n<h3 id=\"part-5-s3\">5.2 3D 开发核心差异<a class=\"headerlink\" href=\"#part-5/part-5-s3\" title=\"永久链接至标题\">¶</a></h3>\n<p>从 2D 转向 3D 时，节点、信号与架构思想完全相通，重点补齐以下几块内容：</p>\n<ul>\n<li><strong>资产导入流程</strong>：推荐使用 Blender 导出 <code class=\"docutils literal notranslate\">.glb</code> 或 <code class=\"docutils literal notranslate\">.gltf</code> 格式，Godot 对其支持最稳定，也可以直接导入 <code class=\"docutils literal notranslate\">.blend</code> 工程文件。</li>\n<li><strong>核心 3D 节点</strong>：<code class=\"docutils literal notranslate\">CharacterBody3D</code>、<code class=\"docutils literal notranslate\">SpringArm3D</code> 用于防穿墙第三人称相机、<code class=\"docutils literal notranslate\">GridMap</code> 用于 3D 块状地图拼接、<code class=\"docutils literal notranslate\">NavigationRegion3D</code> 搭配 <code class=\"docutils literal notranslate\">NavigationAgent3D</code> 实现 3D 寻路。</li>\n<li><strong>光照与环境</strong>：<code class=\"docutils literal notranslate\">DirectionalLight3D</code> 模拟太阳光，<code class=\"docutils literal notranslate\">WorldEnvironment</code> 管理天空盒、雾效、辉光与环境光遮蔽。</li>\n</ul>\n<h3 id=\"part-5-s4\">5.3 性能优化进阶<a class=\"headerlink\" href=\"#part-5/part-5-s4\" title=\"永久链接至标题\">¶</a></h3>\n<p>性能优化的第一原则是先用 Profiler 找到真实瓶颈，不要过早优化。常见进阶手段包括：</p>\n<ul>\n<li><strong>批量渲染重复物体</strong>：草地、树林或大量弹幕使用 <code class=\"docutils literal notranslate\">MultiMeshInstance2D/3D</code>，以极少的 Draw Call 渲染成千上万个实例。</li>\n<li><strong>屏幕外休眠</strong>：为远处敌人挂载 <code class=\"docutils literal notranslate\">VisibleOnScreenEnabler2D/3D</code>，离开视野后自动暂停更新。</li>\n<li><strong>底层接口与扩展</strong>：遇到极限计算或实体规模时，可绕过场景树直接调用 <code class=\"docutils literal notranslate\">RenderingServer</code>、<code class=\"docutils literal notranslate\">PhysicsServer2D</code>，或将热点逻辑迁移到 C# 与 GDExtension。</li>\n</ul>\n<h3 id=\"part-5-s5\">5.4 多人联机基础概念<a class=\"headerlink\" href=\"#part-5/part-5-s5\" title=\"永久链接至标题\">¶</a></h3>\n<p>Godot 内置了基于 ENet、WebSocket 和 WebRTC 的联机框架，通常采用客户端-服务端权威模型。核心围绕三个概念展开：</p>\n<ul>\n<li><strong><code class=\"docutils literal notranslate\">@rpc</code> 注解</strong>：用于远程过程调用，例如通知所有客户端在指定位置播放爆炸效果。</li>\n<li><strong><code class=\"docutils literal notranslate\">MultiplayerSpawner</code></strong>：自动在所有客户端同步生成与销毁玩家、子弹等节点。</li>\n<li><strong><code class=\"docutils literal notranslate\">MultiplayerSynchronizer</code></strong>：按设定频率自动同步节点的位置、朝向、血量等属性。</li>\n</ul>\n<h3 id=\"part-5-s6\">5.5 本地化与跨平台导出<a class=\"headerlink\" href=\"#part-5/part-5-s6\" title=\"永久链接至标题\">¶</a></h3>\n<ul>\n<li><strong>多语言本地化</strong>：将全部文本整理为 CSV 表格导入项目，在界面与代码中填写键值或调用 <code class=\"docutils literal notranslate\">tr(\"UI_START_GAME\")</code>，通过 <code class=\"docutils literal notranslate\">TranslationServer.set_locale(\"en\")</code> 即可切换语言。</li>\n<li><strong>常见导出注意项</strong>：\n<ul>\n<li><strong>Windows</strong>：首次导出需下载对应版本的 Export Templates；修改 <code class=\"docutils literal notranslate\">.exe</code> 图标需要配置 <code class=\"docutils literal notranslate\">rcedit</code>。</li>\n<li><strong>Web</strong>：Godot 4.3 起支持单线程网页导出，部署门槛大幅降低；发布到 <a href=\"http://itch.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">itch.io</a> 时留意 SharedArrayBuffer 相关勾选。</li>\n<li><strong>Android</strong>：需提前配置 JDK、Android SDK 与调试签名密钥，并做好触屏虚拟按键适配。</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"part-5-s7\">第五篇推荐视频与拓展资源<a class=\"headerlink\" href=\"#part-5/part-5-s7\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"admonition seealso\"><p class=\"admonition-title\">推荐学习资料</p>\n<p><strong>Shader 入门教程</strong><br>\n链接：<a href=\"https://www.bilibili.com/video/BV1tEPXzREfs\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">https://www.bilibili.com/video/BV1tEPXzREfs</a></p>\n<ul>\n<li><strong>前置建议</strong>：不建议在入门初期优先观看，应在完成前四篇基础开发流程、实际有视觉特效需求后再按需选学。</li>\n<li><strong>配套参考</strong>：<a href=\"https://godotshaders.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"reference external\">Godot Shaders 社区效果库</a></li>\n</ul>\n</div>\n<p>GDshader、3D 开发、多人联机与跨平台导出等方向建议直接以 Godot 官方文档对应专题为准，在具体项目遇到需求时结合官方文档与社区示例按需查阅。</p>\n","plainText":"第五篇：进阶拓展地图 本篇定位 完成前四篇内容后，即已具备独立开发完整中小型游戏的基础能力。以下五个方向属于按需选修的进阶主题，本篇仅梳理核心概念与学习入口，待实际项目涉及时再深入研究。 5.1 Shader 着色器入门 Shader 是运行在 GPU 上的小程序，能以很低的性能开销实现丰富的视觉效果。Godot 使用类 GLSL 的 GDShader 语法，2D 声明 shader_type canvas_item; ，3D 声明 shader_type spatial; 。 2D 项目中最实用的四个入门效果是：受击闪白、角色描边、像素溶解、水面波动。 下面是一个可直接使用的 2D 受击闪白示例。为 Sprite2D 添加 ShaderMaterial 并填入以下代码，受击时用 Tween 将 flash_amount 从 1.0 过渡到 0.0 即可： GDShader shader_type canvas_item ; uniform vec4 flash_color : source_color = vec4 ( 1.0 , 1.0 , 1.0 , 1.0 ); uniform float flash_amount : hint_range ( 0.0 , 1.0 ) = 0.0 ; void fragment () { // 进入 fragment() 时 COLOR 已包含贴图采样与节点 modulate 染色结果 // 仅混合 COLOR.rgb 可同时保留原始透明度与 modulate 染色效果 COLOR . rgb = mix ( COLOR . rgb , flash_color . rgb , flash_amount ); } 5.2 3D 开发核心差异 从 2D 转向 3D 时，节点、信号与架构思想完全相通，重点补齐以下几块内容： 资产导入流程 ：推荐使用 Blender 导出 .glb 或 .gltf 格式，Godot 对其支持最稳定，也可以直接导入 .blend 工程文件。 核心 3D 节点 ： CharacterBody3D 、 SpringArm3D 用于防穿墙第三人称相机、 GridMap 用于 3D 块状地图拼接、 NavigationRegion3D 搭配 NavigationAgent3D 实现 3D 寻路。 光照与环境 ： DirectionalLight3D 模拟太阳光， WorldEnvironment 管理天空盒、雾效、辉光与环境光遮蔽。 5.3 性能优化进阶 性能优化的第一原则是先用 Profiler 找到真实瓶颈，不要过早优化。常见进阶手段包括： 批量渲染重复物体 ：草地、树林或大量弹幕使用 MultiMeshInstance2D/3D ，以极少的 Draw Call 渲染成千上万个实例。 屏幕外休眠 ：为远处敌人挂载 VisibleOnScreenEnabler2D/3D ，离开视野后自动暂停更新。 底层接口与扩展 ：遇到极限计算或实体规模时，可绕过场景树直接调用 RenderingServer 、 PhysicsServer2D ，或将热点逻辑迁移到 C# 与 GDExtension。 5.4 多人联机基础概念 Godot 内置了基于 ENet、WebSocket 和 WebRTC 的联机框架，通常采用客户端-服务端权威模型。核心围绕三个概念展开： @rpc 注解 ：用于远程过程调用，例如通知所有客户端在指定位置播放爆炸效果。 MultiplayerSpawner ：自动在所有客户端同步生成与销毁玩家、子弹等节点。 MultiplayerSynchronizer ：按设定频率自动同步节点的位置、朝向、血量等属性。 5.5 本地化与跨平台导出 多语言本地化 ：将全部文本整理为 CSV 表格导入项目，在界面与代码中填写键值或调用 tr(\"UI_START_GAME\") ，通过 TranslationServer.set_locale(\"en\") 即可切换语言。 常见导出注意项 ： Windows ：首次导出需下载对应版本的 Export Templates；修改 .exe 图标需要配置 rcedit 。 Web ：Godot 4.3 起支持单线程网页导出，部署门槛大幅降低；发布到 itch.io 时留意 SharedArrayBuffer 相关勾选。 Android ：需提前配置 JDK、Android SDK 与调试签名密钥，并做好触屏虚拟按键适配。 第五篇推荐视频与拓展资源 推荐学习资料 Shader 入门教程 链接： https://www.bilibili.com/video/BV1tEPXzREfs 前置建议 ：不建议在入门初期优先观看，应在完成前四篇基础开发流程、实际有视觉特效需求后再按需选学。 配套参考 ： Godot Shaders 社区效果库 GDshader、3D 开发、多人联机与跨平台导出等方向建议直接以 Godot 官方文档对应专题为准，在具体项目遇到需求时结合官方文档与社区示例按需查阅。"},{"id":"epilogue","group":"实战与索引","title":"结语：从教程转向独立 Demo 与 Game Jam","shortTitle":"结语：独立 Demo 与 Game Jam","summary":"脱离教程依赖后的进阶路线：通过小型原型与 Game Jam 极限开发持续提升工程落地能力。","sections":[],"html":"<h1 id=\"epilogue-s1\">结语：从教程转向独立 Demo 与 Game Jam</h1>\n<p>视频教程的价值在于帮助开发者度过零基础阶段、建立设计模式与架构意识；真正拉开工程能力差距的阶段，始于脱离教程、独立制作小型 Demo 以及参加 Game Jam 极限开发比赛。</p>\n<ul>\n<li><strong>尽早脱离“教程依赖”</strong>：完成入门与综合复刻项目后，应及时转向自主立项。先做体量可控的微型玩法原型，把一个核心机制做扎实、做完整，胜过长期停留在反复跟练教程。</li>\n<li><strong>通过 Game Jam 压缩验证周期</strong>：48 小时或 72 小时的 Game Jam 能够高强度锻炼范围控制、需求取舍、团队 Git 协作、快速排错与完整打包交付能力。</li>\n<li><strong>坚持“完成优先于完美”</strong>：限时开发中优先跑通核心玩法闭环，再迭代手感、音效与界面；赛后复盘代码中的耦合与返工点，往往比单纯阅读理论收获更大。</li>\n<li><strong>以问题驱动查阅文档</strong>：进阶阶段无需系统刷完所有专题视频，遇到具体瓶颈时直接翻阅 Godot 内置文档、官方文档专题与开源示例即可。</li>\n</ul>\n","plainText":"结语：从教程转向独立 Demo 与 Game Jam 视频教程的价值在于帮助开发者度过零基础阶段、建立设计模式与架构意识；真正拉开工程能力差距的阶段，始于脱离教程、独立制作小型 Demo 以及参加 Game Jam 极限开发比赛。 尽早脱离“教程依赖” ：完成入门与综合复刻项目后，应及时转向自主立项。先做体量可控的微型玩法原型，把一个核心机制做扎实、做完整，胜过长期停留在反复跟练教程。 通过 Game Jam 压缩验证周期 ：48 小时或 72 小时的 Game Jam 能够高强度锻炼范围控制、需求取舍、团队 Git 协作、快速排错与完整打包交付能力。 坚持“完成优先于完美” ：限时开发中优先跑通核心玩法闭环，再迭代手感、音效与界面；赛后复盘代码中的耦合与返工点，往往比单纯阅读理论收获更大。 以问题驱动查阅文档 ：进阶阶段无需系统刷完所有专题视频，遇到具体瓶颈时直接翻阅 Godot 内置文档、官方文档专题与开源示例即可。"},{"id":"appendix","group":"实战与索引","title":"附录：学习资料与素材索引","shortTitle":"附录：学习资料与素材索引","summary":"全阶段精选视频与文档总览表，以及免费可商用 2D、3D、UI 与音频游戏素材网站索引。","sections":[{"id":"appendix-s2","title":"附录 A：核心学习资料总览"},{"id":"appendix-s3","title":"附录 B：免费游戏素材网站"}],"html":"<h1 id=\"appendix-s1\">附录：学习资料与素材索引</h1>\n<h3 id=\"appendix-s2\">附录 A：核心学习资料总览<a class=\"headerlink\" href=\"#appendix/appendix-s2\" title=\"永久链接至标题\">¶</a></h3>\n<div class=\"wy-table-responsive\"><table class=\"docutils align-default\">\n<thead>\n<tr>\n<th style=\"text-align:left\">阶段与分类</th>\n<th style=\"text-align:left\">资料名称</th>\n<th style=\"text-align:left\">链接</th>\n<th style=\"text-align:left\">适用说明</th>\n</tr>\n</thead>\n<tbody>\n<
